 (التشكيل من المصدر).",verifiedOn:"2026-11-03"},{id:"ar-salih-ibn-abd-al-quddus-140",lang:"ar",text:"وَنَفيتُ بِالياسِ المُنى ... عَنّي فَطابَ لي القَليلُ",translation:"I banished wishful longings with acceptance, and a little became enough for me.",translationBy:"app",author:"صالح بن عبد القدوس",authorAlt:"Salih ibn Abd al-Quddus",work:"«لله أحمد شاكرا»",year:"القرن 8م / 8th century",sourceUrl:"https://www.aldiwan.net/poem76268.html",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر).",verifiedOn:"2026-11-03"},{id:"ar-maruf-al-rusafi-141",lang:"ar",text:"أدب العلم وعلم الأدب ... شرف النفس ونفس الشرف",translation:"The manners of learning and the learning of manners are the honor of the soul and the soul of honor.",translationBy:"app",author:"معروف الرصافي",authorAlt:"Maruf al-Rusafi",work:"«أدب العلم وعلم الأدب»",year:"أوائل القرن 20 / early 20th century",sourceUrl:"https://adabworld.com/poems/adb-alalm-walm-aladb-v77n005l",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر). تقسيم الشطرين أو وصل كلمة مقطوعة في الصفحة تمّ منّا.",verifiedOn:"2026-11-03"},{id:"ar-maruf-al-rusafi-142",lang:"ar",text:"فالمعالي أودعت في الكتب ... كاللآلي أودعت في الصَدَف",translation:"High achievements are stored in books, as pearls are stored in shells.",translationBy:"app",author:"معروف الرصافي",authorAlt:"Maruf al-Rusafi",work:"«أدب العلم وعلم الأدب»",year:"أوائل القرن 20 / early 20th century",sourceUrl:"https://adabworld.com/poems/adb-alalm-walm-aladb-v77n005l",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر). تقسيم الشطرين أو وصل كلمة مقطوعة في الصفحة تمّ منّا.",verifiedOn:"2026-11-03"},{id:"ar-maruf-al-rusafi-143",lang:"ar",text:"أوَ ما تعلم في هذي الحياة ... أن رب العلم حيٌّ لا يموت",translation:"Do you not know in this life that the person of knowledge lives on and never dies?",translationBy:"app",author:"معروف الرصافي",authorAlt:"Maruf al-Rusafi",work:"«أدب العلم وعلم الأدب»",year:"أوائل القرن 20 / early 20th century",sourceUrl:"https://adabworld.com/poems/adb-alalm-walm-aladb-v77n005l",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر). تقسيم الشطرين أو وصل كلمة مقطوعة في الصفحة تمّ منّا.",verifiedOn:"2026-11-03"},{id:"ar-maruf-al-rusafi-144",lang:"ar",text:"تَيَقّظ فما أنت بالخالد ... ولا حادث الدهر بالراقد",translation:"Wake up: you will not live forever, and the events of time do not sleep.",translationBy:"app",author:"معروف الرصافي",authorAlt:"Maruf al-Rusafi",work:"«تيقظ فما أنت بالخالد»",year:"أوائل القرن 20 / early 20th century",sourceUrl:"https://adabworld.com/poems/tyqz-fma-ant-balkhald-sqekn45x",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر). تقسيم الشطرين أو وصل كلمة مقطوعة في الصفحة تمّ منّا.",verifiedOn:"2026-11-03"},{id:"ar-maruf-al-rusafi-145",lang:"ar",text:"فخلّد بسعيك مجداً يدوم ... دوام النجوم بلا جاحد",translation:"Immortalize yourself with effort, a glory that lasts like the stars, beyond denial.",translationBy:"app",author:"معروف الرصافي",authorAlt:"Maruf al-Rusafi",work:"«تيقظ فما أنت بالخالد»",year:"أوائل القرن 20 / early 20th century",sourceUrl:"https://adabworld.com/poems/tyqz-fma-ant-balkhald-sqekn45x",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر). تقسيم الشطرين أو وصل كلمة مقطوعة في الصفحة تمّ منّا.",verifiedOn:"2026-11-03"},{id:"ar-maruf-al-rusafi-146",lang:"ar",text:"وأبقِ لك الذكر بالصالحات ... وخلّ النُزوع إلى الفاسد",translation:"Leave a good name through good deeds, and give up the pull toward what is corrupt.",translationBy:"app",author:"معروف الرصافي",authorAlt:"Maruf al-Rusafi",work:"«تيقظ فما أنت بالخالد»",year:"أوائل القرن 20 / early 20th century",sourceUrl:"https://adabworld.com/poems/tyqz-fma-ant-balkhald-sqekn45x",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر). تقسيم الشطرين أو وصل كلمة مقطوعة في الصفحة تمّ منّا.",verifiedOn:"2026-11-03"},{id:"ar-maruf-al-rusafi-147",lang:"ar",text:"إذا هو أصبح نادى البدار ... وشَمَّر للسعي عن ساعد",translation:"When he wakes in the morning he calls out 'hurry!' and rolls up his sleeves to work.",translationBy:"app",author:"معروف الرصافي",authorAlt:"Maruf al-Rusafi",work:"«تيقظ فما أنت بالخالد»",year:"أوائل القرن 20 / early 20th century",sourceUrl:"https://adabworld.com/poems/tyqz-fma-ant-balkhald-sqekn45x",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر). تقسيم الشطرين أو وصل كلمة مقطوعة في الصفحة تمّ منّا.",verifiedOn:"2026-11-03"},{id:"ar-maruf-al-rusafi-148",lang:"ar",text:"ولا تكُ مُرمىً بداء السكون ... فتُصبحَ كالحجر الجامد",translation:"Do not be struck by the disease of stillness, or you will become like a lifeless stone.",translationBy:"app",author:"معروف الرصافي",authorAlt:"Maruf al-Rusafi",work:"«تيقظ فما أنت بالخالد»",year:"أوائل القرن 20 / early 20th century",sourceUrl:"https://adabworld.com/poems/tyqz-fma-ant-balkhald-sqekn45x",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر). تقسيم الشطرين أو وصل كلمة مقطوعة في الصفحة تمّ منّا.",verifiedOn:"2026-11-03"},{id:"en--000",lang:"en",text:"Since it is possible that thou mayest depart from life this very moment, regulate every act and thought accordingly.",translation:"بما أنك قد تغادر الحياة في هذه اللحظة، فاضبط كل فعل وكل فكرة على هذا الأساس.",translationBy:"app",author:"Marcus Aurelius",authorAlt:"ماركوس أوريليوس",work:"Meditations, tr. George Long",year:"c. 170 CE (tr. 1862)",sourceUrl:"https://classics.mit.edu/Antoninus/meditations.mb.txt",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--001",lang:"en",text:"Give thyself time to learn something new and good, and cease to be whirled around.",translation:"امنح نفسك وقتًا لتتعلم شيئًا جديدًا ونافعًا، وكُفَّ عن الدوران في كل اتجاه.",translationBy:"app",author:"Marcus Aurelius",authorAlt:"ماركوس أوريليوس",work:"Meditations, tr. George Long",year:"c. 170 CE (tr. 1862)",sourceUrl:"https://classics.mit.edu/Antoninus/meditations.mb.txt",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--002",lang:"en",text:"A man then must stand erect, not be kept erect by others.",translation:"على الإنسان أن يقف منتصبًا بنفسه، لا أن يُسنِده الآخرون.",translationBy:"app",author:"Marcus Aurelius",authorAlt:"ماركوس أوريليوس",work:"Meditations, tr. George Long",year:"c. 170 CE (tr. 1862)",sourceUrl:"https://classics.mit.edu/Antoninus/meditations.mb.txt",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--003",lang:"en",text:"Let no act be done without a purpose, nor otherwise than according to the perfect principles of art.",translation:"لا تفعل شيئًا بلا غاية، ولا على غير أصول الإتقان.",translationBy:"app",author:"Marcus Aurelius",authorAlt:"ماركوس أوريليوس",work:"Meditations, tr. George Long",year:"c. 170 CE (tr. 1862)",sourceUrl:"https://classics.mit.edu/Antoninus/meditations.mb.txt",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--004",lang:"en",text:'Take away thy opinion, and then there is taken away the complaint, "I have been harmed."',translation:"أزِل رأيك في الأمر، يزُل معه الشعور بأنك «تضرّرت».",translationBy:"app",author:"Marcus Aurelius",authorAlt:"ماركوس أوريليوس",work:"Meditations, tr. George Long",year:"c. 170 CE (tr. 1862)",sourceUrl:"https://classics.mit.edu/Antoninus/meditations.mb.txt",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--005",lang:"en",text:"Do not act as if thou wert going to live ten thousand years.",translation:"لا تتصرف كأنك ستعيش عشرة آلاف سنة.",translationBy:"app",author:"Marcus Aurelius",authorAlt:"ماركوس أوريليوس",work:"Meditations, tr. George Long",year:"c. 170 CE (tr. 1862)",sourceUrl:"https://classics.mit.edu/Antoninus/meditations.mb.txt",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--006",lang:"en",text:"While thou livest, while it is in thy power, be good.",translation:"ما دمت حيًّا، وما دام الأمر في يدك، فكن صالحًا.",translationBy:"app",author:"Marcus Aurelius",authorAlt:"ماركوس أوريليوس",work:"Meditations, tr. George Long",year:"c. 170 CE (tr. 1862)",sourceUrl:"https://classics.mit.edu/Antoninus/meditations.mb.txt",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--007",lang:"en",text:"Thou must turn to profit the present by the aid of reason and justice.",translation:"عليك أن تنتفع بالحاضر بالعقل والعدل.",translationBy:"app",author:"Marcus Aurelius",authorAlt:"ماركوس أوريليوس",work:"Meditations, tr. George Long",year:"c. 170 CE (tr. 1862)",sourceUrl:"https://classics.mit.edu/Antoninus/meditations.mb.txt",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--008",lang:"en",text:"I am rising to the work of a human being.",translation:"أنا أنهض لأؤدي عمل الإنسان.",translationBy:"app",author:"Marcus Aurelius",authorAlt:"ماركوس أوريليوس",work:"Meditations, tr. George Long",year:"c. 170 CE (tr. 1862)",sourceUrl:"https://classics.mit.edu/Antoninus/meditations.mb.txt",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--009",lang:"en",text:"Nothing happens to any man which he is not formed by nature to bear.",translation:"لا يصيب الإنسانَ شيءٌ إلا وقد هيّأته طبيعته لاحتماله.",translationBy:"app",author:"Marcus Aurelius",authorAlt:"ماركوس أوريليوس",work:"Meditations, tr. George Long",year:"c. 170 CE (tr. 1862)",sourceUrl:"https://classics.mit.edu/Antoninus/meditations.mb.txt",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--010",lang:"en",text:"The best way of avenging thyself is not to become like the wrong doer.",translation:"أفضل طريقة للانتقام ألّا تصير مثل المسيء.",translationBy:"app",author:"Marcus Aurelius",authorAlt:"ماركوس أوريليوس",work:"Meditations, tr. George Long",year:"c. 170 CE (tr. 1862)",sourceUrl:"https://classics.mit.edu/Antoninus/meditations.mb.txt",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--011",lang:"en",text:"Be not ashamed to be helped; for it is thy business to do thy duty like a soldier in the assault on a town.",translation:"لا تخجل من طلب العون؛ فواجبك أن تؤدي مهمتك كجندي يقتحم حصنًا.",translationBy:"app",author:"Marcus Aurelius",authorAlt:"ماركوس أوريليوس",work:"Meditations, tr. George Long",year:"c. 170 CE (tr. 1862)",sourceUrl:"https://classics.mit.edu/Antoninus/meditations.mb.txt",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--013",lang:"en",text:"In discourse thou must attend to what is said, and in every movement thou must observe what is doing.",translation:"في الحديث أصغِ لما يُقال، وفي كل حركة انتبه لما يجري.",translationBy:"app",author:"Marcus Aurelius",authorAlt:"ماركوس أوريليوس",work:"Meditations, tr. George Long",year:"c. 170 CE (tr. 1862)",sourceUrl:"https://classics.mit.edu/Antoninus/meditations.mb.txt",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--014",lang:"en",text:"I can have that opinion about anything, which I ought to have.",translation:"أستطيع أن أتبنى في أي أمر الرأيَ الذي ينبغي أن أتبناه.",translationBy:"app",author:"Marcus Aurelius",authorAlt:"ماركوس أوريليوس",work:"Meditations, tr. George Long",year:"c. 170 CE (tr. 1862)",sourceUrl:"https://classics.mit.edu/Antoninus/meditations.mb.txt",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--015",lang:"en",text:"Some things are in our control and others not.",translation:"بعض الأشياء في نطاق سيطرتنا، وبعضها ليس كذلك.",translationBy:"app",author:"Epictetus",authorAlt:"إبكتيتوس",work:"Enchiridion, tr. Elizabeth Carter",year:"c. 125 CE (tr. 1758)",sourceUrl:"https://classics.mit.edu/Epictetus/epicench.html",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--016",lang:"en",text:"Men are disturbed, not by things, but by the principles and notions which they form concerning things.",translation:"لا تُقلق الناسَ الأشياءُ نفسها، بل الأفكار والتصورات التي يكوّنونها عنها.",translationBy:"app",author:"Epictetus",authorAlt:"إبكتيتوس",work:"Enchiridion, tr. Elizabeth Carter",year:"c. 125 CE (tr. 1758)",sourceUrl:"https://classics.mit.edu/Epictetus/epicench.html",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--017",lang:"en",text:"Don't demand that things happen as you wish, but wish that they happen as they do happen, and you will go on well.",translation:"لا تطلب أن تجري الأمور كما تريد، بل أرِد أن تجري كما تجري، فتسير أمورك على خير.",translationBy:"app",author:"Epictetus",authorAlt:"إبكتيتوس",work:"Enchiridion, tr. Elizabeth Carter",year:"c. 125 CE (tr. 1758)",sourceUrl:"https://classics.mit.edu/Epictetus/epicench.html",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--018",lang:"en",text:"With every accident, ask yourself what abilities you have for making a proper use of it.",translation:"مع كل طارئ، اسأل نفسك: ما القدرات التي أملكها لأحسن التعامل معه؟",translationBy:"app",author:"Epictetus",authorAlt:"إبكتيتوس",work:"Enchiridion, tr. Elizabeth Carter",year:"c. 125 CE (tr. 1758)",sourceUrl:"https://classics.mit.edu/Epictetus/epicench.html",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--019",lang:"en",text:"If you want to improve, be content to be thought foolish and stupid with regard to external things.",translation:"إن أردت أن تتقدم، فارضَ أن تُعدّ ساذجًا في نظر الناس فيما يخص المظاهر الخارجية.",translationBy:"app",author:"Epictetus",authorAlt:"إبكتيتوس",work:"Enchiridion, tr. Elizabeth Carter",year:"c. 125 CE (tr. 1758)",sourceUrl:"https://classics.mit.edu/Epictetus/epicench.html",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--020",lang:"en",text:"In every affair consider what precedes and follows, and then undertake it.",translation:"في كل أمر، تأمّل ما يسبقه وما يتبعه، ثم أقدِم عليه.",translationBy:"app",author:"Epictetus",authorAlt:"إبكتيتوس",work:"Enchiridion, tr. Elizabeth Carter",year:"c. 125 CE (tr. 1758)",sourceUrl:"https://classics.mit.edu/Epictetus/epicench.html",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--021",lang:"en",text:"Never call yourself a philosopher, nor talk a great deal among the unlearned about theorems, but act conformably to them.",translation:"لا تسمِّ نفسك فيلسوفًا، ولا تُكثر الكلام عن النظريات، بل اعمل بمقتضاها.",translationBy:"app",author:"Epictetus",authorAlt:"إبكتيتوس",work:"Enchiridion, tr. Elizabeth Carter",year:"c. 125 CE (tr. 1758)",sourceUrl:"https://classics.mit.edu/Epictetus/epicench.html",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--022",lang:"en",text:"Let whatever appears to be the best be to you an inviolable law.",translation:"ليكن ما يبدو لك الأفضلَ قانونًا لا يُخرق.",translationBy:"app",author:"Epictetus",authorAlt:"إبكتيتوس",work:"Enchiridion, tr. Elizabeth Carter",year:"c. 125 CE (tr. 1758)",sourceUrl:"https://classics.mit.edu/Epictetus/epicench.html",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--023",lang:"en",text:"You see where the true happiness lies, but you have not the courage to attain it.",translation:"أنت ترى أين تكمن السعادة الحقيقية، لكنك لا تملك الشجاعة لبلوغها.",translationBy:"app",author:"Seneca",authorAlt:"سينيكا",work:"Moral Letters to Lucilius, tr. Richard M. Gummere",year:"c. 65 CE (tr. 1917–25)",sourceUrl:"https://topostext.org/work/736",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--024",lang:"en",text:"You are better at approving the right course than at following it out.",translation:"أنت أبرع في استحسان الطريق الصحيح منك في السير فيه.",translationBy:"app",author:"Seneca",authorAlt:"سينيكا",work:"Moral Letters to Lucilius, tr. Richard M. Gummere",year:"c. 65 CE (tr. 1917–25)",sourceUrl:"https://topostext.org/work/736",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--025",lang:"en",text:"We should toughen our minds, and remove them far from the allurements of pleasure.",translation:"ينبغي أن نقوّي عقولنا ونبعدها عن إغراءات اللذة.",translationBy:"app",author:"Seneca",authorAlt:"سينيكا",work:"Moral Letters to Lucilius, tr. Richard M. Gummere",year:"c. 65 CE (tr. 1917–25)",sourceUrl:"https://topostext.org/work/736",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--026",lang:"en",text:"Perspiration should flow only after toil.",translation:"لا ينبغي أن يسيل العرق إلا بعد الكدّ.",translationBy:"app",author:"Seneca",authorAlt:"سينيكا",work:"Moral Letters to Lucilius, tr. Richard M. Gummere",year:"c. 65 CE (tr. 1917–25)",sourceUrl:"https://topostext.org/work/736",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--028",lang:"en",text:"We can get assistance not only from the living, but from those of the past.",translation:"يمكننا أن نستعين لا بالأحياء فقط، بل بمن سبقونا أيضًا.",translationBy:"app",author:"Seneca",authorAlt:"سينيكا",work:"Moral Letters to Lucilius, tr. Richard M. Gummere",year:"c. 65 CE (tr. 1917–25)",sourceUrl:"https://topostext.org/work/736",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--029",lang:"en",text:"Choose as a guide one whom you will admire more when you see him act than when you hear him speak.",translation:"اختر مرشدًا تزداد إعجابًا به حين تراه يعمل أكثر مما تسمعه يتكلم.",translationBy:"app",author:"Seneca",authorAlt:"سينيكا",work:"Moral Letters to Lucilius, tr. Richard M. Gummere",year:"c. 65 CE (tr. 1917–25)",sourceUrl:"https://topostext.org/work/736",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--030",lang:"en",text:"Do not study philosophy merely during your spare time.",translation:"لا تدرس الفلسفة في أوقات فراغك فقط.",translationBy:"app",author:"Seneca",authorAlt:"سينيكا",work:"Moral Letters to Lucilius, tr. Richard M. Gummere",year:"c. 65 CE (tr. 1917–25)",sourceUrl:"https://topostext.org/work/736",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--031",lang:"en",text:"Philosophy wields her own authority; she appoints her own time and does not allow it to be appointed for her.",translation:"للفلسفة سلطانها الخاص؛ هي تحدد وقتها ولا تسمح لأحد أن يحدده لها.",translationBy:"app",author:"Seneca",authorAlt:"سينيكا",work:"Moral Letters to Lucilius, tr. Richard M. Gummere",year:"c. 65 CE (tr. 1917–25)",sourceUrl:"https://topostext.org/work/736",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--032",lang:"en",text:"A friend should be retained in the spirit; such a friend can never be absent.",translation:"الصديق يُحفظ في الروح، ومثل هذا الصديق لا يغيب أبدًا.",translationBy:"app",author:"Seneca",authorAlt:"سينيكا",work:"Moral Letters to Lucilius, tr. Richard M. Gummere",year:"c. 65 CE (tr. 1917–25)",sourceUrl:"https://topostext.org/work/736",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--033",lang:"en",text:"So true it is that fear looks not to the effect, but to the cause of the effect.",translation:"إن الخوف لا ينظر إلى الأثر، بل إلى سبب الأثر.",translationBy:"app",author:"Seneca",authorAlt:"سينيكا",work:"Moral Letters to Lucilius, tr. Richard M. Gummere",year:"c. 65 CE (tr. 1917–25)",sourceUrl:"https://topostext.org/work/736",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--034",lang:"en",text:"Will you not stop fearing lest that may happen once which really happens every day?",translation:"ألا تكفّ عن الخوف من أن يقع مرةً ما يقع في الحقيقة كل يوم؟",translationBy:"app",author:"Seneca",authorAlt:"سينيكا",work:"Moral Letters to Lucilius, tr. Richard M. Gummere",year:"c. 65 CE (tr. 1917–25)",sourceUrl:"https://topostext.org/work/736",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--036",lang:"en",text:"Sloth, like Rust, consumes faster than Labour wears, while the used Key is always bright",translation:"الكسل كالصدأ، يأكل أسرع مما يُبلي العمل، والمفتاح المستعمل لامع دائمًا.",translationBy:"app",author:"Benjamin Franklin",authorAlt:"بنجامين فرانكلين",work:"The Way to Wealth",year:"1757",sourceUrl:"https://teachingamericanhistory.org/document/the-way-to-wealth/",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--037",lang:"en",text:"dost thou love Life, then do not squander Time, for that’s the Stuff Life is made of",translation:"أتحب الحياة؟ إذن لا تبدّد الوقت، فهو المادة التي صُنعت منها الحياة.",translationBy:"app",author:"Benjamin Franklin",authorAlt:"بنجامين فرانكلين",work:"The Way to Wealth",year:"1757",sourceUrl:"https://teachingamericanhistory.org/document/the-way-to-wealth/",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--038",lang:"en",text:"The sleeping Fox catches no Poultry",translation:"الثعلب النائم لا يصطاد دجاجًا.",translationBy:"app",author:"Benjamin Franklin",authorAlt:"بنجامين فرانكلين",work:"The Way to Wealth",year:"1757",sourceUrl:"https://teachingamericanhistory.org/document/the-way-to-wealth/",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--039",lang:"en",text:"Lost Time is never found again",translation:"الوقت الضائع لا يُستعاد أبدًا.",translationBy:"app",author:"Benjamin Franklin",authorAlt:"بنجامين فرانكلين",work:"The Way to Wealth",year:"1757",sourceUrl:"https://teachingamericanhistory.org/document/the-way-to-wealth/",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--040",lang:"en",text:"Sloth makes all Things difficult, but Industry all easy",translation:"الكسل يجعل كل شيء صعبًا، والاجتهاد يجعل كل شيء سهلًا.",translationBy:"app",author:"Benjamin Franklin",authorAlt:"بنجامين فرانكلين",work:"The Way to Wealth",year:"1757",sourceUrl:"https://teachingamericanhistory.org/document/the-way-to-wealth/",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--041",lang:"en",text:"He that riseth late, must trot all Day, and shall scarce overtake his Business at Night",translation:"من يستيقظ متأخرًا يظل يركض طوال اليوم، وبالكاد يدرك عمله في الليل.",translationBy:"app",author:"Benjamin Franklin",authorAlt:"بنجامين فرانكلين",work:"The Way to Wealth",year:"1757",sourceUrl:"https://teachingamericanhistory.org/document/the-way-to-wealth/",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--042",lang:"en",text:"Laziness travels so slowly, that Poverty soon overtakes him",translation:"الكسل يمشي ببطء شديد حتى يلحق به الفقر سريعًا.",translationBy:"app",author:"Benjamin Franklin",authorAlt:"بنجامين فرانكلين",work:"The Way to Wealth",year:"1757",sourceUrl:"https://teachingamericanhistory.org/document/the-way-to-wealth/",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--043",lang:"en",text:"Drive thy Business, let not that drive thee",translation:"قُد عملك، ولا تدعه يقودك.",translationBy:"app",author:"Benjamin Franklin",authorAlt:"بنجامين فرانكلين",work:"The Way to Wealth",year:"1757",sourceUrl:"https://teachingamericanhistory.org/document/the-way-to-wealth/",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--044",lang:"en",text:"Early to Bed, and early to rise, makes a Man healthy, wealthy and wise",translation:"النوم مبكرًا والاستيقاظ مبكرًا يجعلان المرء صحيحًا وغنيًا وحكيمًا.",translationBy:"app",author:"Benjamin Franklin",authorAlt:"بنجامين فرانكلين",work:"The Way to Wealth",year:"1757",sourceUrl:"https://teachingamericanhistory.org/document/the-way-to-wealth/",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--045",lang:"en",text:"Industry need not wish",translation:"المجتهد لا يحتاج إلى التمنّي.",translationBy:"app",author:"Benjamin Franklin",authorAlt:"بنجامين فرانكلين",work:"The Way to Wealth",year:"1757",sourceUrl:"https://teachingamericanhistory.org/document/the-way-to-wealth/",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--046",lang:"en",text:"He that lives upon Hope will die fasting",translation:"من يعيش على الأمل وحده يموت جائعًا.",translationBy:"app",author:"Benjamin Franklin",authorAlt:"بنجامين فرانكلين",work:"The Way to Wealth",year:"1757",sourceUrl:"https://teachingamericanhistory.org/document/the-way-to-wealth/",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--047",lang:"en",text:"There are no Gains, without Pains",translation:"لا مكاسب بلا تعب.",translationBy:"app",author:"Benjamin Franklin",authorAlt:"بنجامين فرانكلين",work:"The Way to Wealth",year:"1757",sourceUrl:"https://teachingamericanhistory.org/document/the-way-to-wealth/",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--048",lang:"en",text:"He that hath a Trade hath an Estate",translation:"من يملك حرفة يملك ثروة.",translationBy:"app",author:"Benjamin Franklin",authorAlt:"بنجامين فرانكلين",work:"The Way to Wealth",year:"1757",sourceUrl:"https://teachingamericanhistory.org/document/the-way-to-wealth/",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--049",lang:"en",text:"Diligence is the Mother of Good luck",translation:"الاجتهاد أبو الحظ السعيد.",translationBy:"app",author:"Benjamin Franklin",authorAlt:"بنجامين فرانكلين",work:"The Way to Wealth",year:"1757",sourceUrl:"https://teachingamericanhistory.org/document/the-way-to-wealth/",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--050",lang:"en",text:"One To-day is worth two Tomorrows",translation:"يوم واحد اليوم خير من غدَين.",translationBy:"app",author:"Benjamin Franklin",authorAlt:"بنجامين فرانكلين",work:"The Way to Wealth",year:"1757",sourceUrl:"https://teachingamericanhistory.org/document/the-way-to-wealth/",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--051",lang:"en",text:"Have you somewhat to do To-morrow, do it To-day",translation:"إن كان لديك عمل غدًا، فأنجزه اليوم.",translationBy:"app",author:"Benjamin Franklin",authorAlt:"بنجامين فرانكلين",work:"The Way to Wealth",year:"1757",sourceUrl:"https://teachingamericanhistory.org/document/the-way-to-wealth/",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--052",lang:"en",text:"constant Dropping wears away Stones",translation:"قطرات الماء المتتابعة تثقب الحجر.",translationBy:"app",author:"Benjamin Franklin",authorAlt:"بنجامين فرانكلين",work:"The Way to Wealth",year:"1757",sourceUrl:"https://teachingamericanhistory.org/document/the-way-to-wealth/",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--053",lang:"en",text:"little Strokes fell great Oaks",translation:"الضربات الصغيرة تُسقط أشجار البلوط العظيمة.",translationBy:"app",author:"Benjamin Franklin",authorAlt:"بنجامين فرانكلين",work:"The Way to Wealth",year:"1757",sourceUrl:"https://teachingamericanhistory.org/document/the-way-to-wealth/",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--054",lang:"en",text:"Employ thy Time well if thou meanest to gain Leisure",translation:"أحسِن استغلال وقتك إن أردت أن تنال الراحة.",translationBy:"app",author:"Benjamin Franklin",authorAlt:"بنجامين فرانكلين",work:"The Way to Wealth",year:"1757",sourceUrl:"https://teachingamericanhistory.org/document/the-way-to-wealth/",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--055",lang:"en",text:"since thou art not sure of a Minute, throw not away an Hour",translation:"ما دمت لست متأكدًا من دقيقة، فلا تُضيّع ساعة.",translationBy:"app",author:"Benjamin Franklin",authorAlt:"بنجامين فرانكلين",work:"The Way to Wealth",year:"1757",sourceUrl:"https://teachingamericanhistory.org/document/the-way-to-wealth/",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--056",lang:"en",text:"Keep thy Shop, and thy Shop will keep thee",translation:"اعتنِ بمتجرك، يعتنِ بك متجرك.",translationBy:"app",author:"Benjamin Franklin",authorAlt:"بنجامين فرانكلين",work:"The Way to Wealth",year:"1757",sourceUrl:"https://teachingamericanhistory.org/document/the-way-to-wealth/",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--057",lang:"en",text:"The Eye of a Master will do more Work than both his Hands",translation:"عين صاحب العمل تُنجز أكثر مما تنجزه يداه.",translationBy:"app",author:"Benjamin Franklin",authorAlt:"بنجامين فرانكلين",work:"The Way to Wealth",year:"1757",sourceUrl:"https://teachingamericanhistory.org/document/the-way-to-wealth/",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--058",lang:"en",text:"If you would be wealthy, think of Saving as well as of Getting",translation:"إن أردت الثراء، ففكّر في الادخار كما تفكر في الكسب.",translationBy:"app",author:"Benjamin Franklin",authorAlt:"بنجامين فرانكلين",work:"The Way to Wealth",year:"1757",sourceUrl:"https://teachingamericanhistory.org/document/the-way-to-wealth/",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--059",lang:"en",text:"Temperance. Eat not to dullness; drink not to elevation.",translation:"الاعتدال: لا تأكل حتى الخمول، ولا تشرب حتى السُّكر.",translationBy:"app",author:"Benjamin Franklin",authorAlt:"بنجامين فرانكلين",work:"Autobiography — the thirteen virtues",year:"1791",sourceUrl:"https://ushistory.org/FRANKLIN/autobiography/page38.htm",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page. Virtue name added before its precept as on the page.",verifiedOn:"2026-11-03"},{id:"en--060",lang:"en",text:"Silence. Speak not but what may benefit others or yourself; avoid trifling conversation.",translation:"الصمت: لا تقل إلا ما ينفع غيرك أو ينفعك، وتجنّب الكلام التافه.",translationBy:"app",author:"Benjamin Franklin",authorAlt:"بنجامين فرانكلين",work:"Autobiography — the thirteen virtues",year:"1791",sourceUrl:"https://ushistory.org/FRANKLIN/autobiography/page38.htm",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page. Virtue name added before its precept as on the page.",verifiedOn:"2026-11-03"},{id:"en--061",lang:"en",text:"Order. Let all your things have their places; let each part of your business have its time.",translation:"النظام: اجعل لكل شيء من أشيائك مكانًا، ولكل جزء من عملك وقتًا.",translationBy:"app",author:"Benjamin Franklin",authorAlt:"بنجامين فرانكلين",work:"Autobiography — the thirteen virtues",year:"1791",sourceUrl:"https://ushistory.org/FRANKLIN/autobiography/page38.htm",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page. Virtue name added before its precept as on the page.",verifiedOn:"2026-11-03"},{id:"en--062",lang:"en",text:"Resolution. Resolve to perform what you ought; perform without fail what you resolve.",translation:"العزم: اعزم على أداء ما يجب عليك، وأدِّ ما عزمت عليه دون تقصير.",translationBy:"app",author:"Benjamin Franklin",authorAlt:"بنجامين فرانكلين",work:"Autobiography — the thirteen virtues",year:"1791",sourceUrl:"https://ushistory.org/FRANKLIN/autobiography/page38.htm",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page. Virtue name added before its precept as on the page.",verifiedOn:"2026-11-03"},{id:"en--063",lang:"en",text:"Frugality. Make no expense but to do good to others or yourself, i.e., waste nothing.",translation:"الاقتصاد: لا تنفق إلا لخيرٍ لغيرك أو لنفسك؛ أي لا تُسرف في شيء.",translationBy:"app",author:"Benjamin Franklin",authorAlt:"بنجامين فرانكلين",work:"Autobiography — the thirteen virtues",year:"1791",sourceUrl:"https://ushistory.org/FRANKLIN/autobiography/page38.htm",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page. Virtue name added before its precept as on the page.",verifiedOn:"2026-11-03"},{id:"en--064",lang:"en",text:"Industry. Lose no time; be always employed in something useful; cut off all unnecessary actions.",translation:"الاجتهاد: لا تُضِع وقتًا؛ كن دائمًا مشغولًا بشيء نافع، واقطع كل عمل لا ضرورة له.",translationBy:"app",author:"Benjamin Franklin",authorAlt:"بنجامين فرانكلين",work:"Autobiography — the thirteen virtues",year:"1791",sourceUrl:"https://ushistory.org/FRANKLIN/autobiography/page38.htm",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page. Virtue name added before its precept as on the page.",verifiedOn:"2026-11-03"},{id:"en--065",lang:"en",text:"Sincerity. Use no hurtful deceit; think innocently and justly, and, if you speak, speak accordingly.",translation:"الصدق: لا تلجأ إلى خداع مؤذٍ؛ فكّر ببراءة وعدل، وإن تكلمت فتكلم بما يوافق ذلك.",translationBy:"app",author:"Benjamin Franklin",authorAlt:"بنجامين فرانكلين",work:"Autobiography — the thirteen virtues",year:"1791",sourceUrl:"https://ushistory.org/FRANKLIN/autobiography/page38.htm",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page. Virtue name added before its precept as on the page.",verifiedOn:"2026-11-03"},{id:"en--066",lang:"en",text:"Justice. Wrong none by doing injuries or omitting the benefits that are your duty.",translation:"العدل: لا تظلم أحدًا بإيذائه، أو بإغفال ما يجب عليك من نفعه.",translationBy:"app",author:"Benjamin Franklin",authorAlt:"بنجامين فرانكلين",work:"Autobiography — the thirteen virtues",year:"1791",sourceUrl:"https://ushistory.org/FRANKLIN/autobiography/page38.htm",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page. Virtue name added before its precept as on the page.",verifiedOn:"2026-11-03"},{id:"en--067",lang:"en",text:"Moderation. Avoid extremes; forbear resenting injuries so much as you think they deserve.",translation:"التوسط: تجنّب التطرف، ولا تُبالغ في الغضب من الإساءة بقدر ما تظن أنها تستحق.",translationBy:"app",author:"Benjamin Franklin",authorAlt:"بنجامين فرانكلين",work:"Autobiography — the thirteen virtues",year:"1791",sourceUrl:"https://ushistory.org/FRANKLIN/autobiography/page38.htm",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page. Virtue name added before its precept as on the page.",verifiedOn:"2026-11-03"},{id:"en--068",lang:"en",text:"Cleanliness. Tolerate no uncleanliness in body, clothes, or habitation.",translation:"النظافة: لا تقبل أي قذارة في جسدك أو ثيابك أو مسكنك.",translationBy:"app",author:"Benjamin Franklin",authorAlt:"بنجامين فرانكلين",work:"Autobiography — the thirteen virtues",year:"1791",sourceUrl:"https://ushistory.org/FRANKLIN/autobiography/page38.htm",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page. Virtue name added before its precept as on the page.",verifiedOn:"2026-11-03"},{id:"en--069",lang:"en",text:"Tranquillity. Be not disturbed at trifles, or at accidents common or unavoidable.",translation:"السكينة: لا تضطرب للتوافه، ولا للحوادث المعتادة أو التي لا مفر منها.",translationBy:"app",author:"Benjamin Franklin",authorAlt:"بنجامين فرانكلين",work:"Autobiography — the thirteen virtues",year:"1791",sourceUrl:"https://ushistory.org/FRANKLIN/autobiography/page38.htm",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page. Virtue name added before its precept as on the page.",verifiedOn:"2026-11-03"},{id:"en--070",lang:"en",text:"I went to the woods because I wished to live deliberately, to front only the essential facts of life, and see if I could not learn what it had to teach.",translation:"ذهبت إلى الغابة لأني أردت أن أعيش بوعي، وأواجه حقائق الحياة الأساسية فقط، وأرى إن كنت أستطيع أن أتعلم ما لديها لتعلّمني إياه.",translationBy:"app",author:"Henry David Thoreau",authorAlt:"هنري ديفيد ثورو",work:"Walden, ch. 2 “Where I Lived, and What I Lived For”",year:"1854",sourceUrl:"https://etc.usf.edu/lit2go/90/walden-or-life-in-the-woods/1538/where-i-lived-and-what-i-lived-for",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--071",lang:"en",text:"Our life is frittered away by detail.",translation:"حياتنا تتبدد في التفاصيل.",translationBy:"app",author:"Henry David Thoreau",authorAlt:"هنري ديفيد ثورو",work:"Walden, ch. 2 “Where I Lived, and What I Lived For”",year:"1854",sourceUrl:"https://etc.usf.edu/lit2go/90/walden-or-life-in-the-woods/1538/where-i-lived-and-what-i-lived-for",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--072",lang:"en",text:"Let us spend one day as deliberately as Nature, and not be thrown off the track by every nutshell and mosquito's wing that falls on the rails.",translation:"لنقضِ يومًا واحدًا بتأنٍّ مثل الطبيعة، دون أن تُخرجنا عن مسارنا قشرةُ جوزة أو جناح بعوضة يسقط على السكة.",translationBy:"app",author:"Henry David Thoreau",authorAlt:"هنري ديفيد ثورو",work:"Walden, ch. 2 “Where I Lived, and What I Lived For”",year:"1854",sourceUrl:"https://etc.usf.edu/lit2go/90/walden-or-life-in-the-woods/1538/where-i-lived-and-what-i-lived-for",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--073",lang:"en",text:"Time is but the stream I go a-fishing in.",translation:"ما الوقت إلا نهر أذهب لأصطاد فيه.",translationBy:"app",author:"Henry David Thoreau",authorAlt:"هنري ديفيد ثورو",work:"Walden, ch. 2 “Where I Lived, and What I Lived For”",year:"1854",sourceUrl:"https://etc.usf.edu/lit2go/90/walden-or-life-in-the-woods/1538/where-i-lived-and-what-i-lived-for",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page. Dash normalized from the page.",verifiedOn:"2026-11-03"},{id:"en--074",lang:"en",text:"Morning is when I am awake and there is a dawn in me.",translation:"الصباح هو حين أكون يقظًا ويكون في داخلي فجر.",translationBy:"app",author:"Henry David Thoreau",authorAlt:"هنري ديفيد ثورو",work:"Walden, ch. 2 “Where I Lived, and What I Lived For”",year:"1854",sourceUrl:"https://etc.usf.edu/lit2go/90/walden-or-life-in-the-woods/1538/where-i-lived-and-what-i-lived-for",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--075",lang:"en",text:"To be awake is to be alive.",translation:"أن تكون يقظًا يعني أن تكون حيًّا.",translationBy:"app",author:"Henry David Thoreau",authorAlt:"هنري ديفيد ثورو",work:"Walden, ch. 2 “Where I Lived, and What I Lived For”",year:"1854",sourceUrl:"https://etc.usf.edu/lit2go/90/walden-or-life-in-the-woods/1538/where-i-lived-and-what-i-lived-for",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--076",lang:"en",text:"Why should we live with such hurry and waste of life?",translation:"لماذا نعيش بكل هذه العجلة وهذا الهدر للحياة؟",translationBy:"app",author:"Henry David Thoreau",authorAlt:"هنري ديفيد ثورو",work:"Walden, ch. 2 “Where I Lived, and What I Lived For”",year:"1854",sourceUrl:"https://etc.usf.edu/lit2go/90/walden-or-life-in-the-woods/1538/where-i-lived-and-what-i-lived-for",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--077",lang:"en",text:"Sell your clothes and keep your thoughts.",translation:"بِع ثيابك واحتفظ بأفكارك.",translationBy:"app",author:"Henry David Thoreau",authorAlt:"هنري ديفيد ثورو",work:"Walden, ch. 18 “Conclusion”",year:"1854",sourceUrl:"https://human.libretexts.org/Bookshelves/Literature_and_Literacy/American_Literature/American_Literature_I_(Eidenmuller)/04:_Romantic_Literature_(18201860)/4.17:_Walden-_Conclusion",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--078",lang:"en",text:"Things do not change; we change.",translation:"الأشياء لا تتغير؛ نحن الذين نتغير.",translationBy:"app",author:"Henry David Thoreau",authorAlt:"هنري ديفيد ثورو",work:"Walden, ch. 18 “Conclusion”",year:"1854",sourceUrl:"https://human.libretexts.org/Bookshelves/Literature_and_Literacy/American_Literature/American_Literature_I_(Eidenmuller)/04:_Romantic_Literature_(18201860)/4.17:_Walden-_Conclusion",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--079",lang:"en",text:"Do not trouble yourself much to get new things, whether clothes or friends.",translation:"لا تُتعب نفسك كثيرًا في الحصول على أشياء جديدة، سواء أكانت ثيابًا أم أصدقاء.",translationBy:"app",author:"Henry David Thoreau",authorAlt:"هنري ديفيد ثورو",work:"Walden, ch. 18 “Conclusion”",year:"1854",sourceUrl:"https://human.libretexts.org/Bookshelves/Literature_and_Literacy/American_Literature/American_Literature_I_(Eidenmuller)/04:_Romantic_Literature_(18201860)/4.17:_Walden-_Conclusion",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--080",lang:"en",text:"Let him step to the music which he hears, however measured or far away.",translation:"دعه يمشِ على إيقاع الموسيقى التي يسمعها، مهما كانت هادئة أو بعيدة.",translationBy:"app",author:"Henry David Thoreau",authorAlt:"هنري ديفيد ثورو",work:"Walden, ch. 18 “Conclusion”",year:"1854",sourceUrl:"https://human.libretexts.org/Bookshelves/Literature_and_Literacy/American_Literature/American_Literature_I_(Eidenmuller)/04:_Romantic_Literature_(18201860)/4.17:_Walden-_Conclusion",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--081",lang:"en",text:"Love your life, poor as it is.",translation:"أحِبَّ حياتك، مهما كانت فقيرة.",translationBy:"app",author:"Henry David Thoreau",authorAlt:"هنري ديفيد ثورو",work:"Walden, ch. 18 “Conclusion”",year:"1854",sourceUrl:"https://human.libretexts.org/Bookshelves/Literature_and_Literacy/American_Literature/American_Literature_I_(Eidenmuller)/04:_Romantic_Literature_(18201860)/4.17:_Walden-_Conclusion",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--082",lang:"en",text:"Let every one mind his own business, and endeavor to be what he was made.",translation:"ليهتمّ كلٌّ بشأنه، وليسعَ إلى أن يكون ما خُلق ليكونه.",translationBy:"app",author:"Henry David Thoreau",authorAlt:"هنري ديفيد ثورو",work:"Walden, ch. 18 “Conclusion”",year:"1854",sourceUrl:"https://human.libretexts.org/Bookshelves/Literature_and_Literacy/American_Literature/American_Literature_I_(Eidenmuller)/04:_Romantic_Literature_(18201860)/4.17:_Walden-_Conclusion",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--083",lang:"en",text:"Only that day dawns to which we are awake.",translation:"لا يطلع إلا ذلك اليوم الذي نكون له يقظين.",translationBy:"app",author:"Henry David Thoreau",authorAlt:"هنري ديفيد ثورو",work:"Walden, ch. 18 “Conclusion”",year:"1854",sourceUrl:"https://human.libretexts.org/Bookshelves/Literature_and_Literacy/American_Literature/American_Literature_I_(Eidenmuller)/04:_Romantic_Literature_(18201860)/4.17:_Walden-_Conclusion",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--085",lang:"en",text:"Absolve you to yourself, and you shall have the suffrage of the world.",translation:"برِّئ نفسك أمام نفسك، تنَل تأييد العالم.",translationBy:"app",author:"Ralph Waldo Emerson",authorAlt:"رالف والدو إمرسون",work:"Self-Reliance",year:"1841",sourceUrl:"https://anthology.lib.virginia.edu/work/Emerson/emerson-self-reliance",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--086",lang:"en",text:"A foolish consistency is the hobgoblin of little minds, adored by little statesmen and philosophers and divines.",translation:"الاتساق الأحمق هو غول العقول الصغيرة، يعبده صغار الساسة والفلاسفة ورجال الدين.",translationBy:"app",author:"Ralph Waldo Emerson",authorAlt:"رالف والدو إمرسون",work:"Self-Reliance",year:"1841",sourceUrl:"https://anthology.lib.virginia.edu/work/Emerson/emerson-self-reliance",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--087",lang:"en",text:"Whoso would be a man must be a nonconformist.",translation:"من أراد أن يكون رجلًا فعليه ألا يكون مقلِّدًا.",translationBy:"app",author:"Ralph Waldo Emerson",authorAlt:"رالف والدو إمرسون",work:"Self-Reliance",year:"1841",sourceUrl:"https://anthology.lib.virginia.edu/work/Emerson/emerson-self-reliance",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--088",lang:"en",text:"Every great man is an unique.",translation:"كل عظيم فريد من نوعه.",translationBy:"app",author:"Ralph Waldo Emerson",authorAlt:"رالف والدو إمرسون",work:"Self-Reliance",year:"1841",sourceUrl:"https://anthology.lib.virginia.edu/work/Emerson/emerson-self-reliance",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--089",lang:"en",text:"Do that which is assigned thee, and thou canst not hope too much or dare too much.",translation:"أدِّ ما أُسند إليك، ولن تكون مفرطًا في الأمل أو الجرأة.",translationBy:"app",author:"Ralph Waldo Emerson",authorAlt:"رالف والدو إمرسون",work:"Self-Reliance",year:"1841",sourceUrl:"https://anthology.lib.virginia.edu/work/Emerson/emerson-self-reliance",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--090",lang:"en",text:"Do your work, and you shall reinforce yourself.",translation:"أنجز عملك، تَقْوَ بنفسك.",translationBy:"app",author:"Ralph Waldo Emerson",authorAlt:"رالف والدو إمرسون",work:"Self-Reliance",year:"1841",sourceUrl:"https://anthology.lib.virginia.edu/work/Emerson/emerson-self-reliance",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--091",lang:"en",text:"We pass for what we are.",translation:"نحن نُعرَف بما نحن عليه حقًا.",translationBy:"app",author:"Ralph Waldo Emerson",authorAlt:"رالف والدو إمرسون",work:"Self-Reliance",year:"1841",sourceUrl:"https://anthology.lib.virginia.edu/work/Emerson/emerson-self-reliance",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--092",lang:"en",text:"Your genuine action will explain itself and will explain your other genuine actions.",translation:"فعلك الصادق يشرح نفسه، ويشرح أفعالك الصادقة الأخرى.",translationBy:"app",author:"Ralph Waldo Emerson",authorAlt:"رالف والدو إمرسون",work:"Self-Reliance",year:"1841",sourceUrl:"https://anthology.lib.virginia.edu/work/Emerson/emerson-self-reliance",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--093",lang:"en",text:"The force of character is cumulative.",translation:"قوة الشخصية تتراكم.",translationBy:"app",author:"Ralph Waldo Emerson",authorAlt:"رالف والدو إمرسون",work:"Self-Reliance",year:"1841",sourceUrl:"https://anthology.lib.virginia.edu/work/Emerson/emerson-self-reliance",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--094",lang:"en",text:"Greatness always appeals to the future.",translation:"العظمة تخاطب المستقبل دائمًا.",translationBy:"app",author:"Ralph Waldo Emerson",authorAlt:"رالف والدو إمرسون",work:"Self-Reliance",year:"1841",sourceUrl:"https://anthology.lib.virginia.edu/work/Emerson/emerson-self-reliance",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--095",lang:"en",text:"Be it how it will, do right now.",translation:"مهما يكن من أمر، افعل الصواب الآن.",translationBy:"app",author:"Ralph Waldo Emerson",authorAlt:"رالف والدو إمرسون",work:"Self-Reliance",year:"1841",sourceUrl:"https://anthology.lib.virginia.edu/work/Emerson/emerson-self-reliance",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--097",lang:"en",text:"No law can be sacred to me but that of my nature.",translation:"لا قانون مقدّس عندي إلا قانون طبيعتي.",translationBy:"app",author:"Ralph Waldo Emerson",authorAlt:"رالف والدو إمرسون",work:"Self-Reliance",year:"1841",sourceUrl:"https://anthology.lib.virginia.edu/work/Emerson/emerson-self-reliance",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--099",lang:"en",text:"Discontent is the want of self-reliance: it is infirmity of will.",translation:"السخط هو نقص الاعتماد على النفس؛ إنه ضعف في الإرادة.",translationBy:"app",author:"Ralph Waldo Emerson",authorAlt:"رالف والدو إمرسون",work:"Self-Reliance",year:"1841",sourceUrl:"https://anthology.lib.virginia.edu/work/Emerson/emerson-self-reliance",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--100",lang:"en",text:"Let us, then, be up and doing, / With a heart for any fate; / Still achieving, still pursuing, / Learn to labor and to wait.",translation:"فلننهض إذن ولنعمل، بقلب مستعد لأي قدر؛ نواصل الإنجاز والسعي، ونتعلم أن نكدّ وأن ننتظر.",translationBy:"app",author:"Henry Wadsworth Longfellow",authorAlt:"هنري وادزورث لونغفيلو",work:"A Psalm of Life",year:"1838",sourceUrl:"https://www.poetryfoundation.org/poems/44644/a-psalm-of-life",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--101",lang:"en",text:"Act,— act in the living Present! / Heart within, and God o’erhead!",translation:"اعمل، اعمل في الحاضر الحي! القلب في داخلك، والله فوقك!",translationBy:"app",author:"Henry Wadsworth Longfellow",authorAlt:"هنري وادزورث لونغفيلو",work:"A Psalm of Life",year:"1838",sourceUrl:"https://www.poetryfoundation.org/poems/44644/a-psalm-of-life",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--102",lang:"en",text:"Be not like dumb, driven cattle! / Be a hero in the strife!",translation:"لا تكن كالماشية الخرساء المسوقة! كن بطلًا في المعركة!",translationBy:"app",author:"Henry Wadsworth Longfellow",authorAlt:"هنري وادزورث لونغفيلو",work:"A Psalm of Life",year:"1838",sourceUrl:"https://www.poetryfoundation.org/poems/44644/a-psalm-of-life",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--103",lang:"en",text:"How dull it is to pause, to make an end, / To rust unburnish'd, not to shine in use!",translation:"ما أبلد أن تتوقف، أن تضع نهاية، أن تصدأ غير مصقول بدل أن تلمع في الاستعمال!",translationBy:"app",author:"Alfred, Lord Tennyson",authorAlt:"ألفريد تينيسون",work:"Ulysses",year:"1842",sourceUrl:"https://rpo.library.utoronto.ca/poems/ulysses",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--104",lang:"en",text:"To follow knowledge like a sinking star, / Beyond the utmost bound of human thought.",translation:"أن تتبع المعرفة كنجم يهوي، إلى ما وراء أقصى حدود الفكر البشري.",translationBy:"app",author:"Alfred, Lord Tennyson",authorAlt:"ألفريد تينيسون",work:"Ulysses",year:"1842",sourceUrl:"https://rpo.library.utoronto.ca/poems/ulysses",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--105",lang:"en",text:"Made weak by time and fate, but strong in will / To strive, to seek, to find, and not to yield.",translation:"أضعفنا الزمن والقدر، لكننا أقوياء الإرادة: أن نسعى، ونبحث، ونجد، ولا نستسلم.",translationBy:"app",author:"Alfred, Lord Tennyson",authorAlt:"ألفريد تينيسون",work:"Ulysses",year:"1842",sourceUrl:"https://rpo.library.utoronto.ca/poems/ulysses",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--106",lang:"en",text:"I am the master of my fate; / I am the captain of my soul.",translation:"أنا سيّد قدري، أنا قائد روحي.",translationBy:"app",author:"William Ernest Henley",authorAlt:"وليام إرنست هنلي",work:"Invictus",year:"1888",sourceUrl:"https://www.poetryloverspage.com/poets/henley/invictus.html",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--107",lang:"en",text:"Under the bludgeoning of chance / My head is bloody, but unbowed.",translation:"تحت ضربات الصدفة القاسية، رأسي دامٍ لكنه لا ينحني.",translationBy:"app",author:"William Ernest Henley",authorAlt:"وليام إرنست هنلي",work:"Invictus",year:"1888",sourceUrl:"https://www.poetryloverspage.com/poets/henley/invictus.html",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--108",lang:"en",text:"Is it not pleasant to learn with a constant perseverance and application?",translation:"أليس من الممتع أن تتعلم بمثابرة واجتهاد دائمين؟",translationBy:"app",author:"Confucius",authorAlt:"كونفوشيوس",work:"Analects, Book 1, tr. James Legge",year:"c. 5th century BCE (tr. 1861)",sourceUrl:"https://mail.yellowbridge.com/onlinelit/analects01.php",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"},{id:"en--109",lang:"en",text:"When you have faults, do not fear to abandon them.",translation:"إن كانت لديك أخطاء، فلا تخشَ أن تتخلى عنها.",translationBy:"app",author:"Confucius",authorAlt:"كونفوشيوس",work:"Analects, Book 1, tr. James Legge",year:"c. 5th century BCE (tr. 1861)",sourceUrl:"https://mail.yellowbridge.com/onlinelit/analects01.php",sourceNote:"Public domain (author died long ago; translation pre-1929 where applicable). Copied from the linked page.",verifiedOn:"2026-11-03"}]};function $f(t){let e=2166136261;for(let a=0;a<t.length;a++)e^=t.charCodeAt(a),e=Math.imul(e,16777619);return e>>>0}function Mv(t,e){return[...t].sort((a,n)=>$f(e+a.id)-$f(e+n.id)||(a.id<n.id?-1:1))}function Pf(t,e,a,n,l){let i=t.filter((d)=>d.lang===e),o=Math.max(0,la(a,n))%366,s=l.find((d)=>d.date===a&&d.lang===e&&!d.deletedAt),u=Mv(i,n);if(s){let d=i.find((c)=>c.id===s.quoteId)??null;if(d)return{quote:d,repeated:o>=i.length,dayIndex:o,librarySize:i.length}}if(!i.length)return{quote:null,repeated:!1,dayIndex:o,librarySize:0};return{quote:u[o%u.length],repeated:o>=u.length,dayIndex:o,librarySize:i.length}}function tg(t,e,a){let n=t.goals.filter((d)=>!d.deletedAt&&d.status==="active");if(!n.length)return{kind:"planFirst"};let l=(d)=>{let c=n.find((m)=>m.id===d);if(!c)
