n",authorAlt:"رالف والدو إمرسون",work:"Self-Reliance (Essays: First Series)",year:"1841",sourceUrl:"https://anthology.lib.virginia.edu/work/Emerson/emerson-self-reliance",sourceNote:"Public domain.",verifiedOn:"2026-11-03"},{id:"en-shakespeare-measure-doubts",lang:"en",text:"Our doubts are traitors, / And make us lose the good we oft might win, / By fearing to attempt.",translation:"شكوكنا خونة، تُضيّع علينا الخير الذي كان يمكن أن نكسبه، لأننا نخاف أن نحاول.",translationBy:"app",author:"William Shakespeare",authorAlt:"وليم شكسبير",work:"Measure for Measure, Act 1, Scene 4 (Lucio)",year:"c. 1603–1604",sourceUrl:"https://absoluteshakespeare.com/plays/measure_for_measure/a1s4.htm",sourceNote:"Public domain. Punctuation follows the linked edition; other editions omit the comma after “win”.",verifiedOn:"2026-11-03"},{id:"ar-mutanabbi-ghamarta",lang:"ar",text:"إِذا غامَرتَ في شَرَفٍ مَرومٍ ... فَلا تَقنَع بِما دونَ النُجومِ",translation:"If you venture after a coveted honor, do not settle for anything below the stars.",translationBy:"app",author:"أبو الطيب المتنبي",authorAlt:"Abu al-Tayyib al-Mutanabbi",work:"قصيدة «إذا غامرت في شرف مروم» — الديوان",year:"القرن الرابع الهجري / 10th century",sourceUrl:"https://www.aldiwan.net/poem10566.html",sourceNote:"ملكية عامة. النص كما في صفحة الديوان المرتبطة.",verifiedOn:"2026-11-03"},{id:"ar-shabbi-iradat-al-hayat-jibal",lang:"ar",text:"ومن لا يحبُّ صُعودَ الجبالِ ... يَعِشْ أبَدَ الدَّهرِ بَيْنَ الحُفَرْ",translation:"Whoever does not love climbing mountains will live forever among the pits.",translationBy:"app",author:"أبو القاسم الشابي",authorAlt:"Abu al-Qasim al-Shabbi",work:"قصيدة «إرادة الحياة» — ديوان «أغاني الحياة»",year:"1933",sourceUrl:"https://adabworld.com/poems/idha-alshab-ywma-arad-alhyah-aqlyegrq",sourceNote:"ملكية عامة (توفي الشاعر 1934). تشتهر رواية «ومن يتهيّب صعود الجبال»؛ المعروض هنا هو نص المصدر المرتبط.",verifiedOn:"2026-11-03"},{id:"ar-zuhayr-ibn-abi-sulma-000",lang:"ar",text:"وَمَن يَكُ ذا فَضلٍ فَيَبخَل بِفَضلِهِ ... عَلى قَومِهِ يُستَغنَ عَنهُ وَيُذمَمِ",translation:"Whoever has a gift and withholds it from his people will be done without, and blamed.",translationBy:"app",author:"زهير بن أبي سلمى",authorAlt:"Zuhayr ibn Abi Sulma",work:"المعلقة «أمن أم أوفى دمنة لم تكلم»",year:"ما قبل الإسلام / 6th century",sourceUrl:"https://www.aldiwan.net/poem25065.html",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر).",verifiedOn:"2026-11-03"},{id:"ar-zuhayr-ibn-abi-sulma-001",lang:"ar",text:"وَمَن يَجعَلِ المَعروفَ مِن دونِ عِرضِهِ ... يَفِرهُ وَمَن لا يَتَّقِ الشَتمَ يُشتَمِ",translation:"Whoever uses generosity to shield his honor keeps it whole; whoever does not guard against insult will be insulted.",translationBy:"app",author:"زهير بن أبي سلمى",authorAlt:"Zuhayr ibn Abi Sulma",work:"المعلقة «أمن أم أوفى دمنة لم تكلم»",year:"ما قبل الإسلام / 6th century",sourceUrl:"https://www.aldiwan.net/poem25065.html",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر).",verifiedOn:"2026-11-03"},{id:"ar-zuhayr-ibn-abi-sulma-002",lang:"ar",text:"وَمَن هابَ أَسبابَ المَنِيَّةِ يَلقَها ... وَلَو رامَ أَسبابَ السَماءِ بِسُلَّمِ",translation:"Whoever fears the causes of death will meet them, even if he climbs a ladder to the sky.",translationBy:"app",author:"زهير بن أبي سلمى",authorAlt:"Zuhayr ibn Abi Sulma",work:"المعلقة «أمن أم أوفى دمنة لم تكلم»",year:"ما قبل الإسلام / 6th century",sourceUrl:"https://www.aldiwan.net/poem25065.html",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر).",verifiedOn:"2026-11-03"},{id:"ar-zuhayr-ibn-abi-sulma-003",lang:"ar",text:"وَمَن يوفِ لا يُذمَم وَمَن يُفضِ قَلبُهُ ... إِلى مُطمَئِنِّ البِرِّ لا يَتَجَمجَمِ",translation:"Whoever keeps his word is not blamed, and a heart that rests in goodness does not hesitate.",translationBy:"app",author:"زهير بن أبي سلمى",authorAlt:"Zuhayr ibn Abi Sulma",work:"المعلقة «أمن أم أوفى دمنة لم تكلم»",year:"ما قبل الإسلام / 6th century",sourceUrl:"https://www.aldiwan.net/poem25065.html",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر).",verifiedOn:"2026-11-03"},{id:"ar-zuhayr-ibn-abi-sulma-004",lang:"ar",text:"وَمَن يَغتَرِب يَحسِب عَدُوّاً صَديقَهُ ... وَمَن لا يُكَرِّم نَفسَهُ لا يُكَرَّمِ",translation:"Far from home, you may take an enemy for a friend; and whoever does not honor himself will not be honored.",translationBy:"app",author:"زهير بن أبي سلمى",authorAlt:"Zuhayr ibn Abi Sulma",work:"المعلقة «أمن أم أوفى دمنة لم تكلم»",year:"ما قبل الإسلام / 6th century",sourceUrl:"https://www.aldiwan.net/poem25065.html",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر).",verifiedOn:"2026-11-03"},{id:"ar-zuhayr-ibn-abi-sulma-005",lang:"ar",text:"وَمَهما تَكُن عِندَ اِمرِئٍ مِن خَليقَةٍ ... وَإِن خالَها تَخفى عَلى الناسِ تُعلَمِ",translation:"Whatever trait a person has, even if he thinks it hidden from people, will become known.",translationBy:"app",author:"زهير بن أبي سلمى",authorAlt:"Zuhayr ibn Abi Sulma",work:"المعلقة «أمن أم أوفى دمنة لم تكلم»",year:"ما قبل الإسلام / 6th century",sourceUrl:"https://www.aldiwan.net/poem25065.html",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر).",verifiedOn:"2026-11-03"},{id:"ar-zuhayr-ibn-abi-sulma-006",lang:"ar",text:"وَمَن لا يَزَل يَستَحمِلُ الناسَ نَفسَهُ ... وَلا يُغنِها يَوماً مِنَ الدَهرِ يُسأَمِ",translation:"Whoever keeps loading himself onto others and never makes himself independent will in time grow tiresome to them.",translationBy:"app",author:"زهير بن أبي سلمى",authorAlt:"Zuhayr ibn Abi Sulma",work:"المعلقة «أمن أم أوفى دمنة لم تكلم»",year:"ما قبل الإسلام / 6th century",sourceUrl:"https://www.aldiwan.net/poem25065.html",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر).",verifiedOn:"2026-11-03"},{id:"ar-zuhayr-ibn-abi-sulma-007",lang:"ar",text:"وَأَعلَمُ عِلمَ اليَومِ وَالأَمسِ قَبلَهُ ... وَلَكِنَّني عَن عِلمِ ما في غَدٍ عَمي",translation:"I know what today holds, and yesterday before it, but I am blind to what tomorrow holds.",translationBy:"app",author:"زهير بن أبي سلمى",authorAlt:"Zuhayr ibn Abi Sulma",work:"المعلقة «أمن أم أوفى دمنة لم تكلم»",year:"ما قبل الإسلام / 6th century",sourceUrl:"https://www.aldiwan.net/poem25065.html",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر).",verifiedOn:"2026-11-03"},{id:"ar-zuhayr-ibn-abi-sulma-008",lang:"ar",text:"فَلا تَكتُمُنَّ اللَهَ ما في نُفوسِكُم ... لِيَخفى وَمَهما يُكتَمِ اللَهُ يَعلَمِ",translation:"Do not try to hide from God what is in your hearts; whatever is hidden from Him, God knows.",translationBy:"app",author:"زهير بن أبي سلمى",authorAlt:"Zuhayr ibn Abi Sulma",work:"المعلقة «أمن أم أوفى دمنة لم تكلم»",year:"ما قبل الإسلام / 6th century",sourceUrl:"https://www.aldiwan.net/poem25065.html",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر).",verifiedOn:"2026-11-03"},{id:"ar-abu-al-tayyib-al-mutanab-009",lang:"ar",text:"عَلى قَدرِ أَهلِ العَزمِ تَأتي العَزائِمُ ... وَتَأتي عَلى قَدرِ الكِرامِ المَكارِمُ",translation:"Resolve comes in the measure of the resolute, and noble deeds in the measure of the noble.",translationBy:"app",author:"أبو الطيب المتنبي",authorAlt:"Abu al-Tayyib al-Mutanabbi",work:"قصيدة «على قدر أهل العزم تأتي العزائم»",year:"القرن الرابع الهجري / 10th century",sourceUrl:"https://adabworld.com/poems/ala-qdr-ahl-alazm-bxck86",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر).",verifiedOn:"2026-11-03"},{id:"ar-abu-al-tayyib-al-mutanab-010",lang:"ar",text:"وَتَعظُمُ في عَينِ الصَغيرِ صِغارُها ... وَتَصغُرُ في عَينِ العَظيمِ العَظائِمُ",translation:"Small things look great in small eyes, and great things look small in great eyes.",translationBy:"app",author:"أبو الطيب المتنبي",authorAlt:"Abu al-Tayyib al-Mutanabbi",work:"قصيدة «على قدر أهل العزم تأتي العزائم»",year:"القرن الرابع الهجري / 10th century",sourceUrl:"https://adabworld.com/poems/ala-qdr-ahl-alazm-bxck86",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر).",verifiedOn:"2026-11-03"},{id:"ar-abu-al-tayyib-al-mutanab-011",lang:"ar",text:"إِذا كانَ ما تَنويهِ فِعلاً مُضارِعاً ... مَضى قَبلَ أَن تُلقى عَلَيهِ الجَوازِمُ",translation:"When what you intend is a deed in progress, it is done before anything can cut it short.",translationBy:"app",author:"أبو الطيب المتنبي",authorAlt:"Abu al-Tayyib al-Mutanabbi",work:"قصيدة «على قدر أهل العزم تأتي العزائم»",year:"القرن الرابع الهجري / 10th century",sourceUrl:"https://adabworld.com/poems/ala-qdr-ahl-alazm-bxck86",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر).",verifiedOn:"2026-11-03"},{id:"ar-abu-al-tayyib-al-mutanab-012",lang:"ar",text:"إِذا تَرَحَّلتَ عَن قَومٍ وَقَد قَدَروا ... أَن لا تُفارِقَهُم فَالراحِلونَ هُمُ",translation:"If you leave people who could have kept you from leaving, they are the ones who have truly left.",translationBy:"app",author:"أبو الطيب المتنبي",authorAlt:"Abu al-Tayyib al-Mutanabbi",work:"قصيدة «واحر قلباه ممن قلبه شبم»",year:"القرن الرابع الهجري / 10th century",sourceUrl:"https://adabworld.com/poems/wahr-qlbah-mmn-qlbh-44399h",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر).",verifiedOn:"2026-11-03"},{id:"ar-abu-al-tayyib-al-mutanab-013",lang:"ar",text:"شَرُّ البِلادِ مَكانٌ لا صَديقَ بِهِ ... وَشَرُّ ما يَكسِبُ الإِنسانُ ما يَصِمُ",translation:"The worst land is a place with no friend in it, and the worst gain is one that brings disgrace.",translationBy:"app",author:"أبو الطيب المتنبي",authorAlt:"Abu al-Tayyib al-Mutanabbi",work:"قصيدة «واحر قلباه ممن قلبه شبم»",year:"القرن الرابع الهجري / 10th century",sourceUrl:"https://adabworld.com/poems/wahr-qlbah-mmn-qlbh-44399h",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر).",verifiedOn:"2026-11-03"},{id:"ar-abu-al-tayyib-al-mutanab-014",lang:"ar",text:"إِذا نَظَرتَ نُيوبَ اللَيثِ بارِزَةً ... فَلا تَظُنَّنَّ أَنَّ اللَيثَ مُبتَسِمُ",translation:"When you see the lion's fangs bared, do not think the lion is smiling.",translationBy:"app",author:"أبو الطيب المتنبي",authorAlt:"Abu al-Tayyib al-Mutanabbi",work:"قصيدة «واحر قلباه ممن قلبه شبم»",year:"القرن الرابع الهجري / 10th century",sourceUrl:"https://adabworld.com/poems/wahr-qlbah-mmn-qlbh-44399h",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر).",verifiedOn:"2026-11-03"},{id:"ar-abu-al-tayyib-al-mutanab-015",lang:"ar",text:"وَما اِنتِفاعُ أَخي الدُنيا بِناظِرِهِ ... إِذا اِستَوَت عِندَهُ الأَنوارُ وَالظُلَمُ",translation:"What use are a man's eyes to him if light and darkness look the same to him?",translationBy:"app",author:"أبو الطيب المتنبي",authorAlt:"Abu al-Tayyib al-Mutanabbi",work:"قصيدة «واحر قلباه ممن قلبه شبم»",year:"القرن الرابع الهجري / 10th century",sourceUrl:"https://adabworld.com/poems/wahr-qlbah-mmn-qlbh-44399h",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر).",verifiedOn:"2026-11-03"},{id:"ar-abu-al-qasim-al-shabbi-016",lang:"ar",text:"إِذا الشَّعْبُ يوماً أرادَ الحياةَ ... فلا بُدَّ أنْ يَسْتَجيبَ القدرْ",translation:"If a people one day wills to live, fate must answer.",translationBy:"app",author:"أبو القاسم الشابي",authorAlt:"Abu al-Qasim al-Shabbi",work:"قصيدة «إرادة الحياة» — ديوان «أغاني الحياة»",year:"1933",sourceUrl:"https://adabworld.com/poems/idha-alshab-ywma-arad-alhyah-aqlyegrq",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر).",verifiedOn:"2026-11-03"},{id:"ar-abu-al-qasim-al-shabbi-017",lang:"ar",text:"ولا بُدَّ للَّيْلِ أنْ ينجلي ... ولا بُدَّ للقيدِ أن يَنْكَسِرْ",translation:"The night must clear, and the chain must break.",translationBy:"app",author:"أبو القاسم الشابي",authorAlt:"Abu al-Qasim al-Shabbi",work:"قصيدة «إرادة الحياة» — ديوان «أغاني الحياة»",year:"1933",sourceUrl:"https://adabworld.com/poems/idha-alshab-ywma-arad-alhyah-aqlyegrq",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر).",verifiedOn:"2026-11-03"},{id:"ar-abu-al-qasim-al-shabbi-018",lang:"ar",text:"ومَن لم يعانقْهُ شَوْقُ الحياةِ ... تَبَخَّرَ في جَوِّها واندَثَرْ",translation:"Whoever is not embraced by a longing for life evaporates into its air and vanishes.",translationBy:"app",author:"أبو القاسم الشابي",authorAlt:"Abu al-Qasim al-Shabbi",work:"قصيدة «إرادة الحياة» — ديوان «أغاني الحياة»",year:"1933",sourceUrl:"https://adabworld.com/poems/idha-alshab-ywma-arad-alhyah-aqlyegrq",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر).",verifiedOn:"2026-11-03"},{id:"ar-abu-al-qasim-al-shabbi-019",lang:"ar",text:"إِذا مَا طَمحْتُ إلى غايةٍ ... رَكِبتُ المنى ونَسيتُ الحَذرْ",translation:"When I aspire to a goal, I ride my hopes and forget caution.",translationBy:"app",author:"أبو القاسم الشابي",authorAlt:"Abu al-Qasim al-Shabbi",work:"قصيدة «إرادة الحياة» — ديوان «أغاني الحياة»",year:"1933",sourceUrl:"https://adabworld.com/poems/idha-alshab-ywma-arad-alhyah-aqlyegrq",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر).",verifiedOn:"2026-11-03"},{id:"ar-abu-al-qasim-al-shabbi-020",lang:"ar",text:"ولم أتجنَّبْ وُعورَ الشِّعابِ ... ولا كُبَّةَ اللَّهَبِ المُستَعِرْ",translation:"I did not avoid the rough mountain paths, nor the blazing mass of flame.",translationBy:"app",author:"أبو القاسم الشابي",authorAlt:"Abu al-Qasim al-Shabbi",work:"قصيدة «إرادة الحياة» — ديوان «أغاني الحياة»",year:"1933",sourceUrl:"https://adabworld.com/poems/idha-alshab-ywma-arad-alhyah-aqlyegrq",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر).",verifiedOn:"2026-11-03"},{id:"ar-abu-al-qasim-al-shabbi-021",lang:"ar",text:"أُباركُ في النَّاسِ أهلَ الطُّموحِ ... ومَن يَسْتَلِذُّ ركوبَ الخطرْ",translation:"I bless the ambitious among people, and those who enjoy facing risk.",translationBy:"app",author:"أبو القاسم الشابي",authorAlt:"Abu al-Qasim al-Shabbi",work:"قصيدة «إرادة الحياة» — ديوان «أغاني الحياة»",year:"1933",sourceUrl:"https://adabworld.com/poems/idha-alshab-ywma-arad-alhyah-aqlyegrq",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر).",verifiedOn:"2026-11-03"},{id:"ar-abu-al-qasim-al-shabbi-022",lang:"ar",text:"وأُعْلِنَ في الكونِ أنَّ الطّموحَ ... لهيبُ الحَيَاةِ ورُوحُ الظَّفَرْ",translation:"And I declare to the world that ambition is the flame of life and the spirit of victory.",translationBy:"app",author:"أبو القاسم الشابي",authorAlt:"Abu al-Qasim al-Shabbi",work:"قصيدة «إرادة الحياة» — ديوان «أغاني الحياة»",year:"1933",sourceUrl:"https://adabworld.com/poems/idha-alshab-ywma-arad-alhyah-aqlyegrq",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر).",verifiedOn:"2026-11-03"},{id:"ar-abu-al-qasim-al-shabbi-023",lang:"ar",text:"إِذا طَمَحَتْ للحَياةِ النُّفوسُ ... فلا بُدَّ أنْ يستجيبَ القَدَرْ",translation:"When souls aspire to life, fate must answer.",translationBy:"app",author:"أبو القاسم الشابي",authorAlt:"Abu al-Qasim al-Shabbi",work:"قصيدة «إرادة الحياة» — ديوان «أغاني الحياة»",year:"1933",sourceUrl:"https://adabworld.com/poems/idha-alshab-ywma-arad-alhyah-aqlyegrq",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر).",verifiedOn:"2026-11-03"},{id:"ar-abu-al-qasim-al-shabbi-024",lang:"ar",text:"ومن تَعْبُدُ النُّورَ أَحلامهُ ... يُبارِكُهُ النُّورُ أَنَّى ظَهَرْ",translation:"Whoever dreams in devotion to the light, the light blesses wherever it appears.",translationBy:"app",author:"أبو القاسم الشابي",authorAlt:"Abu al-Qasim al-Shabbi",work:"قصيدة «إرادة الحياة» — ديوان «أغاني الحياة»",year:"1933",sourceUrl:"https://adabworld.com/poems/idha-alshab-ywma-arad-alhyah-aqlyegrq",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر).",verifiedOn:"2026-11-03"},{id:"ar-ibn-al-wardi-025",lang:"ar",text:"اطلبِ العلمَ ولا تكسلْ فما ... أبعدَ الخيرَ على أهلِ الكسلْ",translation:"Seek knowledge and do not be lazy; how far good things are from the lazy!",translationBy:"app",author:"ابن الوردي",authorAlt:"Ibn al-Wardi",work:"«لامية ابن الوردي» (اعتزل ذكر الأغاني والغزل)",year:"القرن الثامن الهجري / 14th century",sourceUrl:"https://adabworld.com/poems/aatzl-dhkr-alaghany-walghzl-88vc3o",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر). تقسيم الشطرين أو وصل كلمة مقطوعة في الصفحة تمّ منّا.",verifiedOn:"2026-11-03"},{id:"ar-ibn-al-wardi-026",lang:"ar",text:"واهجرِ النومَ وحصِّلْهُ فَمَنْ ... يعرفِ المطلوبَ يحقرْ ما بذلْ",translation:"Give up sleep and gain it; whoever knows what he seeks thinks little of what he spends.",translationBy:"app",author:"ابن الوردي",authorAlt:"Ibn al-Wardi",work:"«لامية ابن الوردي» (اعتزل ذكر الأغاني والغزل)",year:"القرن الثامن الهجري / 14th century",sourceUrl:"https://adabworld.com/poems/aatzl-dhkr-alaghany-walghzl-88vc3o",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر). تقسيم الشطرين أو وصل كلمة مقطوعة في الصفحة تمّ منّا.",verifiedOn:"2026-11-03"},{id:"ar-ibn-al-wardi-027",lang:"ar",text:"لا تقلْ قدْ ذهبَتْ أربابُهُ ... كلُّ مَنْ سارَ على الدربِ وصلْ",translation:"Do not say its masters are gone; whoever walks the road arrives.",translationBy:"app",author:"ابن الوردي",authorAlt:"Ibn al-Wardi",work:"«لامية ابن الوردي» (اعتزل ذكر الأغاني والغزل)",year:"القرن الثامن الهجري / 14th century",sourceUrl:"https://adabworld.com/poems/aatzl-dhkr-alaghany-walghzl-88vc3o",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر). تقسيم الشطرين أو وصل كلمة مقطوعة في الصفحة تمّ منّا.",verifiedOn:"2026-11-03"},{id:"ar-ibn-al-wardi-028",lang:"ar",text:"في ازديادِ العلمِ إرغامُ العِدى ... وجمالُ العلمِ يا صاحِ العملْ",translation:"Growing in knowledge humbles your rivals, and the beauty of knowledge, my friend, is action.",translationBy:"app",author:"ابن الوردي",authorAlt:"Ibn al-Wardi",work:"«لامية ابن الوردي» (اعتزل ذكر الأغاني والغزل)",year:"القرن الثامن الهجري / 14th century",sourceUrl:"https://adabworld.com/poems/aatzl-dhkr-alaghany-walghzl-88vc3o",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر). تقسيم الشطرين أو وصل كلمة مقطوعة في الصفحة تمّ منّا.",verifiedOn:"2026-11-03"},{id:"ar-ibn-al-wardi-029",lang:"ar",text:"لا تقلْ أصلي وفصلي أبدا ... إنما أصلُ الفتى ما قدْ حصلْ",translation:"Never say 'my origin, my lineage'; a man's true origin is what he has achieved.",translationBy:"app",author:"ابن الوردي",authorAlt:"Ibn al-Wardi",work:"«لامية ابن الوردي» (اعتزل ذكر الأغاني والغزل)",year:"القرن الثامن الهجري / 14th century",sourceUrl:"https://adabworld.com/poems/aatzl-dhkr-alaghany-walghzl-88vc3o",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر). تقسيم الشطرين أو وصل كلمة مقطوعة في الصفحة تمّ منّا.",verifiedOn:"2026-11-03"},{id:"ar-ibn-al-wardi-030",lang:"ar",text:"قدْ يسودُ المرءُ منْ غيرِ أبٍ ... وبحسنِ السبكِ قَدْ يُنْفى الزغلْ",translation:"A man may lead without a famous father; good refining removes the impurity.",translationBy:"app",author:"ابن الوردي",authorAlt:"Ibn al-Wardi",work:"«لامية ابن الوردي» (اعتزل ذكر الأغاني والغزل)",year:"القرن الثامن الهجري / 14th century",sourceUrl:"https://adabworld.com/poems/aatzl-dhkr-alaghany-walghzl-88vc3o",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر). تقسيم الشطرين أو وصل كلمة مقطوعة في الصفحة تمّ منّا.",verifiedOn:"2026-11-03"},{id:"ar-ibn-al-wardi-031",lang:"ar",text:"قيمةُ الإنسانِ ما يحسِنُهُ ... أكثرَ الإنسانُ منهُ أوْ أقلْ",translation:"A person's worth is what he does well, whether he does much of it or little.",translationBy:"app",author:"ابن الوردي",authorAlt:"Ibn al-Wardi",work:"«لامية ابن الوردي» (اعتزل ذكر الأغاني والغزل)",year:"القرن الثامن الهجري / 14th century",sourceUrl:"https://adabworld.com/poems/aatzl-dhkr-alaghany-walghzl-88vc3o",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر). تقسيم الشطرين أو وصل كلمة مقطوعة في الصفحة تمّ منّا.",verifiedOn:"2026-11-03"},{id:"ar-ibn-al-wardi-032",lang:"ar",text:"وادّرعْ جداً وكداً واجتنبْ ... صحبةَ الحمقى وأربابِ البخلْ",translation:"Put on the armor of effort and toil, and avoid the company of fools and misers.",translationBy:"app",author:"ابن الوردي",authorAlt:"Ibn al-Wardi",work:"«لامية ابن الوردي» (اعتزل ذكر الأغاني والغزل)",year:"القرن الثامن الهجري / 14th century",sourceUrl:"https://adabworld.com/poems/aatzl-dhkr-alaghany-walghzl-88vc3o",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر). تقسيم الشطرين أو وصل كلمة مقطوعة في الصفحة تمّ منّا.",verifiedOn:"2026-11-03"},{id:"ar-ibn-al-wardi-033",lang:"ar",text:"قصِّرِ الآمالَ في الدنيا تفزْ ... فدليلُ العقلِ تقصيرُ الأملْ",translation:"Keep your worldly hopes short and you will win; short hope is the sign of reason.",translationBy:"app",author:"ابن الوردي",authorAlt:"Ibn al-Wardi",work:"«لامية ابن الوردي» (اعتزل ذكر الأغاني والغزل)",year:"القرن الثامن الهجري / 14th century",sourceUrl:"https://adabworld.com/poems/aatzl-dhkr-alaghany-walghzl-88vc3o",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر). تقسيم الشطرين أو وصل كلمة مقطوعة في الصفحة تمّ منّا.",verifiedOn:"2026-11-03"},{id:"ar-ibn-al-wardi-034",lang:"ar",text:"ليسَ ما يحوي الفتى عَنْ عزمِهِ ... لا ولا ما فاتَ يوماً بالكسلْ",translation:"What a man gains does not come apart from his resolve, and what he loses is not lost by laziness alone.",translationBy:"app",author:"ابن الوردي",authorAlt:"Ibn al-Wardi",work:"«لامية ابن الوردي» (اعتزل ذكر الأغاني والغزل)",year:"القرن الثامن الهجري / 14th century",sourceUrl:"https://adabworld.com/poems/aatzl-dhkr-alaghany-walghzl-88vc3o",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر). تقسيم الشطرين أو وصل كلمة مقطوعة في الصفحة تمّ منّا.",verifiedOn:"2026-11-03"},{id:"ar-al-tughra-i-035",lang:"ar",text:"قد رشَّحوك لأمرٍ إنْ فطِنتَ لهُ ... فاربأْ بنفسكَ أن ترعى مع الهَمَلِ",translation:"They have put you forward for a great matter, if you grasp it; so raise yourself above grazing with the herd.",translationBy:"app",author:"الطغرائي",authorAlt:"al-Tughra'i",work:"«لامية العجم» (أصالة الرأي صانتني)",year:"القرن الخامس الهجري / 11th–12th century",sourceUrl:"https://adabworld.com/poems/asala-alray-santny-lamya-wi50vt",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر).",verifiedOn:"2026-11-03"},{id:"ar-al-tughra-i-036",lang:"ar",text:"أُريدُ بسطةَ كَفٍ أستعينُ بها ... على قضاءِ حُقوقٍ للعُلَى قِبَلي",translation:"I want an open hand, to help me pay the debts I owe to high ambition.",translationBy:"app",author:"الطغرائي",authorAlt:"al-Tughra'i",work:"«لامية العجم» (أصالة الرأي صانتني)",year:"القرن الخامس الهجري / 11th–12th century",sourceUrl:"https://adabworld.com/poems/asala-alray-santny-lamya-wi50vt",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر).",verifiedOn:"2026-11-03"},{id:"ar-al-tughra-i-037",lang:"ar",text:"رضَى الذليلِ بخفضِ العيشِ يخفضُه ... والعِزُّ عندَ رسيمِ الأينُقِ الذُلُلِ",translation:"The lowly man's content with a low life keeps him low; honor lies in the hard ride of tireless camels.",translationBy:"app",author:"الطغرائي",authorAlt:"al-Tughra'i",work:"«لامية العجم» (أصالة الرأي صانتني)",year:"القرن الخامس الهجري / 11th–12th century",sourceUrl:"https://adabworld.com/poems/asala-alray-santny-lamya-wi50vt",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر).",verifiedOn:"2026-11-03"},{id:"ar-al-tughra-i-038",lang:"ar",text:"وعادةُ النصلِ أن يُزْهَى بجوهرِه ... وليس يعملُ إلّا في يدَيْ بَطَلِ",translation:"A blade may pride itself on its steel, yet it works only in a hero's hands.",translationBy:"app",author:"الطغرائي",authorAlt:"al-Tughra'i",work:"«لامية العجم» (أصالة الرأي صانتني)",year:"القرن الخامس الهجري / 11th–12th century",sourceUrl:"https://adabworld.com/poems/asala-alray-santny-lamya-wi50vt",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر).",verifiedOn:"2026-11-03"},{id:"ar-al-tughra-i-039",lang:"ar",text:"أعلِّلُ النفس بالآمالِ أرقُبُها ... ما أضيقَ العيشَ لولا فسحةُ الأمَلِ",translation:"I comfort my soul with hopes I watch for; how narrow life would be without the room that hope gives!",translationBy:"app",author:"الطغرائي",authorAlt:"al-Tughra'i",work:"«لامية العجم» (أصالة الرأي صانتني)",year:"القرن الخامس الهجري / 11th–12th century",sourceUrl:"https://adabworld.com/poems/asala-alray-santny-lamya-wi50vt",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر).",verifiedOn:"2026-11-03"},{id:"ar-al-tughra-i-040",lang:"ar",text:"حبُّ السلامةِ يُثْني همَّ صاحِبه ... عن المعالي ويُغرِي المرءَ بالكَسلِ",translation:"Love of safety turns a man's ambition from high things and tempts him to laziness.",translationBy:"app",author:"الطغرائي",authorAlt:"al-Tughra'i",work:"«لامية العجم» (أصالة الرأي صانتني)",year:"القرن الخامس الهجري / 11th–12th century",sourceUrl:"https://adabworld.com/poems/asala-alray-santny-lamya-wi50vt",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر).",verifiedOn:"2026-11-03"},{id:"ar-al-tughra-i-041",lang:"ar",text:"فاصبرْ لها غيرَ محتالٍ ولا ضَجِرٍ ... في حادثِ الدهرِ ما يُغني عن الحِيَلِ",translation:"Endure it without scheming or complaint; in the blows of time, patience serves better than tricks.",translationBy:"app",author:"الطغرائي",authorAlt:"al-Tughra'i",work:"«لامية العجم» (أصالة الرأي صانتني)",year:"القرن الخامس الهجري / 11th–12th century",sourceUrl:"https://adabworld.com/poems/asala-alray-santny-lamya-wi50vt",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر).",verifiedOn:"2026-11-03"},{id:"ar-al-tughra-i-042",lang:"ar",text:"غالى بنفسيَ عِرفاني بقيمتِها ... فصُنْتُها عن رخيصِ القَدْرِ مبتَذَلِ",translation:"Knowing my own worth made me value myself, so I kept myself from what is cheap and common.",translationBy:"app",author:"الطغرائي",authorAlt:"al-Tughra'i",work:"«لامية العجم» (أصالة الرأي صانتني)",year:"القرن الخامس الهجري / 11th–12th century",sourceUrl:"https://adabworld.com/poems/asala-alray-santny-lamya-wi50vt",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر).",verifiedOn:"2026-11-03"},{id:"ar-al-tughra-i-043",lang:"ar",text:"لم أرتضِ العيشَ والأيامُ مقبلةٌ ... فكيف أرضَى وقد ولَّتْ على عَجَلِ",translation:"I was not content with life when the days were coming toward me; how could I be, now that they hurry away?",translationBy:"app",author:"الطغرائي",authorAlt:"al-Tughra'i",work:"«لامية العجم» (أصالة الرأي صانتني)",year:"القرن الخامس الهجري / 11th–12th century",sourceUrl:"https://adabworld.com/poems/asala-alray-santny-lamya-wi50vt",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر).",verifiedOn:"2026-11-03"},{id:"ar-abu-al-tayyib-al-mutanab-044",lang:"ar",text:"إِذا أَنتَ أَكرَمتَ الكَريمَ مَلَكتَهُ ... وَإِن أَنتَ أَكرَمتَ اللَئيمَ تَمَرَّدا",translation:"If you honor a noble man, you win him; if you honor a base man, he rebels.",translationBy:"app",author:"أبو الطيب المتنبي",authorAlt:"Abu al-Tayyib al-Mutanabbi",work:"قصيدة «لكل امرئ من دهره ما تعودا»",year:"القرن الرابع الهجري / 10th century",sourceUrl:"https://adabworld.com/%D9%82%D8%B5%D9%8A%D8%AF%D8%A9-%D9%84%D9%83%D9%84-%D8%A7%D9%85%D8%B1%D8%A6-%D9%85%D9%86-%D8%AF%D9%87%D8%B1%D9%87-%D9%85%D8%A7-%D8%AA%D8%B9%D9%88%D8%AF%D8%A7/",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر).",verifiedOn:"2026-11-03"},{id:"ar-abu-al-tayyib-al-mutanab-045",lang:"ar",text:"وَوَضعُ النَدى في مَوضِعِ السَيفِ بِالعُلا ... مُضِرٌّ كَوَضعِ السَيفِ في مَوضِعِ النَدى",translation:"Giving gifts where the sword is needed harms one's standing, just as using the sword where gifts are needed.",translationBy:"app",author:"أبو الطيب المتنبي",authorAlt:"Abu al-Tayyib al-Mutanabbi",work:"قصيدة «لكل امرئ من دهره ما تعودا»",year:"القرن الرابع الهجري / 10th century",sourceUrl:"https://adabworld.com/%D9%82%D8%B5%D9%8A%D8%AF%D8%A9-%D9%84%D9%83%D9%84-%D8%A7%D9%85%D8%B1%D8%A6-%D9%85%D9%86-%D8%AF%D9%87%D8%B1%D9%87-%D9%85%D8%A7-%D8%AA%D8%B9%D9%88%D8%AF%D8%A7/",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر).",verifiedOn:"2026-11-03"},{id:"ar-abu-al-tayyib-al-mutanab-047",lang:"ar",text:"وَإِذا كانَتِ النُفوسُ كِباراً ... تَعِبَت في مُرادِها الأَجسامُ",translation:"When souls are great, the bodies tire in serving their aims.",translationBy:"app",author:"أبو الطيب المتنبي",authorAlt:"Abu al-Tayyib al-Mutanabbi",work:"قصيدة «أين أزمعت أيهذا الهمام»",year:"القرن الرابع الهجري / 10th century",sourceUrl:"https://adabworld.com/poems/ayn-azmat-ayhdha-alhmam-n40stm",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر).",verifiedOn:"2026-11-03"},{id:"ar-abu-al-tayyib-al-mutanab-048",lang:"ar",text:"فَكَثيرٌ مِنَ الشُجاعِ التَوَقّي ... وَكَثيرٌ مِنَ البَليغِ السَلامُ",translation:"Often a brave man's courage is caution, and often an eloquent man's speech is a simple greeting.",translationBy:"app",author:"أبو الطيب المتنبي",authorAlt:"Abu al-Tayyib al-Mutanabbi",work:"قصيدة «أين أزمعت أيهذا الهمام»",year:"القرن الرابع الهجري / 10th century",sourceUrl:"https://adabworld.com/poems/ayn-azmat-ayhdha-alhmam-n40stm",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر).",verifiedOn:"2026-11-03"},{id:"ar-al-imam-al-shafi-i-attri-049",lang:"ar",text:"دَعِ الأَيّامَ تَفعَلُ ما تَشاءُ ... وَطِب نَفساً إِذا حَكَمَ القَضاءُ",translation:"Let the days do what they will, and be at peace when fate decides.",translationBy:"app",author:"الإمام الشافعي (منسوب)",authorAlt:"al-Imam al-Shafi'i (attributed)",work:"قصيدة «دع الأيام تفعل ما تشاء» — ديوان الشافعي",year:"القرن الثاني الهجري / 8th–9th century",sourceUrl:"https://adabworld.com/poems/da-alayam-tfal-ma-8kz1em",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر). النسبة مشهورة وليست قطعية.",verifiedOn:"2026-11-03"},{id:"ar-al-imam-al-shafi-i-attri-050",lang:"ar",text:"وَلا تَجزَع لِحادِثَةِ اللَيالي ... فَما لِحَوادِثِ الدُنيا بَقاءُ",translation:"Do not despair at the misfortunes of the nights; nothing that happens in this world lasts.",translationBy:"app",author:"الإمام الشافعي (منسوب)",authorAlt:"al-Imam al-Shafi'i (attributed)",work:"قصيدة «دع الأيام تفعل ما تشاء» — ديوان الشافعي",year:"القرن الثاني الهجري / 8th–9th century",sourceUrl:"https://adabworld.com/poems/da-alayam-tfal-ma-8kz1em",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر). النسبة مشهورة وليست قطعية.",verifiedOn:"2026-11-03"},{id:"ar-al-imam-al-shafi-i-attri-051",lang:"ar",text:"وَكُن رَجُلاً عَلى الأَهوالِ جَلداً ... وَشيمَتُكَ السَماحَةُ وَالوَفاءُ",translation:"Be a man who stands firm in hardship, whose nature is generosity and loyalty.",translationBy:"app",author:"الإمام الشافعي (منسوب)",authorAlt:"al-Imam al-Shafi'i (attributed)",work:"قصيدة «دع الأيام تفعل ما تشاء» — ديوان الشافعي",year:"القرن الثاني الهجري / 8th–9th century",sourceUrl:"https://adabworld.com/poems/da-alayam-tfal-ma-8kz1em",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر). النسبة مشهورة وليست قطعية.",verifiedOn:"2026-11-03"},{id:"ar-al-imam-al-shafi-i-attri-052",lang:"ar",text:"تَسَتَّر بِالسَخاءِ فَكُلُّ عَيبٍ ... يُغَطّيهِ كَما قيلَ السَخاءُ",translation:"Cover yourself with generosity; generosity, as they say, covers every fault.",translationBy:"app",author:"الإمام الشافعي (منسوب)",authorAlt:"al-Imam al-Shafi'i (attributed)",work:"قصيدة «دع الأيام تفعل ما تشاء» — ديوان الشافعي",year:"القرن الثاني الهجري / 8th–9th century",sourceUrl:"https://adabworld.com/poems/da-alayam-tfal-ma-8kz1em",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر). النسبة مشهورة وليست قطعية.",verifiedOn:"2026-11-03"},{id:"ar-al-imam-al-shafi-i-attri-053",lang:"ar",text:"وَلا تَرجُ السَماحَةَ مِن بَخيلٍ ... فَما في النارِ لِلظَمآنِ ماءُ",translation:"Do not hope for generosity from a miser; there is no water in fire for the thirsty.",translationBy:"app",author:"الإمام الشافعي (منسوب)",authorAlt:"al-Imam al-Shafi'i (attributed)",work:"قصيدة «دع الأيام تفعل ما تشاء» — ديوان الشافعي",year:"القرن الثاني الهجري / 8th–9th century",sourceUrl:"https://adabworld.com/poems/da-alayam-tfal-ma-8kz1em",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر). النسبة مشهورة وليست قطعية.",verifiedOn:"2026-11-03"},{id:"ar-al-imam-al-shafi-i-attri-054",lang:"ar",text:"وَرِزقُكَ لَيسَ يُنقِصُهُ التَأَنّي ... وَلَيسَ يَزيدُ في الرِزقِ العَناءُ",translation:"Patience does not reduce your provision, and anxious strain does not increase it.",translationBy:"app",author:"الإمام الشافعي (منسوب)",authorAlt:"al-Imam al-Shafi'i (attributed)",work:"قصيدة «دع الأيام تفعل ما تشاء» — ديوان الشافعي",year:"القرن الثاني الهجري / 8th–9th century",sourceUrl:"https://adabworld.com/poems/da-alayam-tfal-ma-8kz1em",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر). النسبة مشهورة وليست قطعية.",verifiedOn:"2026-11-03"},{id:"ar-al-imam-al-shafi-i-attri-055",lang:"ar",text:"وَلا حُزنٌ يَدومُ وَلا سُرورٌ ... وَلا بُؤسٌ عَلَيكَ وَلا رَخاءُ",translation:"No sadness lasts, nor joy; no hardship stays with you, nor ease.",translationBy:"app",author:"الإمام الشافعي (منسوب)",authorAlt:"al-Imam al-Shafi'i (attributed)",work:"قصيدة «دع الأيام تفعل ما تشاء» — ديوان الشافعي",year:"القرن الثاني الهجري / 8th–9th century",sourceUrl:"https://adabworld.com/poems/da-alayam-tfal-ma-8kz1em",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر). النسبة مشهورة وليست قطعية.",verifiedOn:"2026-11-03"},{id:"ar-al-imam-al-shafi-i-attri-056",lang:"ar",text:"إِذا ما كُنتَ ذا قَلبٍ قَنوعٍ ... فَأَنتَ وَمالِكُ الدُنيا سَواءُ",translation:"If you have a contented heart, you and the owner of the world are equal.",translationBy:"app",author:"الإمام الشافعي (منسوب)",authorAlt:"al-Imam al-Shafi'i (attributed)",work:"قصيدة «دع الأيام تفعل ما تشاء» — ديوان الشافعي",year:"القرن الثاني الهجري / 8th–9th century",sourceUrl:"https://adabworld.com/poems/da-alayam-tfal-ma-8kz1em",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر). النسبة مشهورة وليست قطعية.",verifiedOn:"2026-11-03"},{id:"ar-al-imam-al-shafi-i-attri-057",lang:"ar",text:"وَأَرضُ اللَهِ واسِعَةٌ وَلَكِن ... إِذا نَزَلَ القَضا ضاقَ الفَضاءُ",translation:"God's earth is wide, but when fate descends, the open space grows narrow.",translationBy:"app",author:"الإمام الشافعي (منسوب)",authorAlt:"al-Imam al-Shafi'i (attributed)",work:"قصيدة «دع الأيام تفعل ما تشاء» — ديوان الشافعي",year:"القرن الثاني الهجري / 8th–9th century",sourceUrl:"https://adabworld.com/poems/da-alayam-tfal-ma-8kz1em",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر). النسبة مشهورة وليست قطعية.",verifiedOn:"2026-11-03"},{id:"ar-al-imam-al-shafi-i-attri-058",lang:"ar",text:"ما في المَقامِ لِذي عَقلٍ وَذي أَدَبِ ... مِن راحَةٍ فَدَعِ الأَوطانَ وَاِغتَرِبِ",translation:"For a person of mind and learning there is no rest in staying put; leave home and travel.",translationBy:"app",author:"الإمام الشافعي (منسوب)",authorAlt:"al-Imam al-Shafi'i (attributed)",work:"قصيدة «ما في المقام لذي عقل وذي أدب» — ديوان الشافعي",year:"القرن الثاني الهجري / 8th–9th century",sourceUrl:"https://adabworld.com/poems/ma-fy-almqam-ldhy-516g06",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر). النسبة مشهورة وليست قطعية.",verifiedOn:"2026-11-03"},{id:"ar-al-imam-al-shafi-i-attri-059",lang:"ar",text:"سافِر تَجِد عِوَضاً عَمَّن تُفارِقُهُ ... وَاِنصَب فَإِنَّ لَذيذَ العَيشِ في النَصَبِ",translation:"Travel, and you will find a replacement for whom you leave; and toil, for the sweetness of life lies in toil.",translationBy:"app",author:"الإمام الشافعي (منسوب)",authorAlt:"al-Imam al-Shafi'i (attributed)",work:"قصيدة «ما في المقام لذي عقل وذي أدب» — ديوان الشافعي",year:"القرن الثاني الهجري / 8th–9th century",sourceUrl:"https://adabworld.com/poems/ma-fy-almqam-ldhy-516g06",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر). النسبة مشهورة وليست قطعية.",verifiedOn:"2026-11-03"},{id:"ar-al-imam-al-shafi-i-attri-060",lang:"ar",text:"إِنّي رَأَيتُ وُقوفَ الماءِ يُفسِدُهُ ... إِن ساحَ طابَ وَإِن لَم يَجرِ لَم يَطِبِ",translation:"I have seen that standing water spoils: if it flows it is sweet, and if it does not run it is not.",translationBy:"app",author:"الإمام الشافعي (منسوب)",authorAlt:"al-Imam al-Shafi'i (attributed)",work:"قصيدة «ما في المقام لذي عقل وذي أدب» — ديوان الشافعي",year:"القرن الثاني الهجري / 8th–9th century",sourceUrl:"https://adabworld.com/poems/ma-fy-almqam-ldhy-516g06",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر). النسبة مشهورة وليست قطعية.",verifiedOn:"2026-11-03"},{id:"ar-al-imam-al-shafi-i-attri-061",lang:"ar",text:"وَالأُسدُ لَولا فِراقُ الأَرضِ مااِفتَرَسَت ... وَالسَهمُ لَولا فِراقُ القَوسِ لَم يُصِبِ",translation:"Lions would not hunt if they never left their ground, and an arrow would not hit if it never left the bow.",translationBy:"app",author:"الإمام الشافعي (منسوب)",authorAlt:"al-Imam al-Shafi'i (attributed)",work:"قصيدة «ما في المقام لذي عقل وذي أدب» — ديوان الشافعي",year:"القرن الثاني الهجري / 8th–9th century",sourceUrl:"https://adabworld.com/poems/ma-fy-almqam-ldhy-516g06",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر). النسبة مشهورة وليست قطعية.",verifiedOn:"2026-11-03"},{id:"ar-al-imam-al-shafi-i-attri-062",lang:"ar",text:"وَالشَمسُ لَو وَقَفَت في الفُلكِ دائِمَةً ... لَمَلَّها الناسُ مِن عُجمٍ وَمِن عَرَبِ",translation:"If the sun stood still in the sky forever, all people, Arab and non-Arab, would grow tired of it.",translationBy:"app",author:"الإمام الشافعي (منسوب)",authorAlt:"al-Imam al-Shafi'i (attributed)",work:"قصيدة «ما في المقام لذي عقل وذي أدب» — ديوان الشافعي",year:"القرن الثاني الهجري / 8th–9th century",sourceUrl:"https://adabworld.com/poems/ma-fy-almqam-ldhy-516g06",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر). النسبة مشهورة وليست قطعية.",verifiedOn:"2026-11-03"},{id:"ar-al-imam-al-shafi-i-attri-063",lang:"ar",text:"وَالتِبرُ كَالتُربِ مُلقىً في أَماكِنِهِ ... وَالعودُ في أَرضِهِ نَوعٌ مِنَ الحَطَبِ",translation:"Gold dust lies like plain dirt where it is found, and aloes wood in its own land is just a kind of firewood.",translationBy:"app",author:"الإمام الشافعي (منسوب)",authorAlt:"al-Imam al-Shafi'i (attributed)",work:"قصيدة «ما في المقام لذي عقل وذي أدب» — ديوان الشافعي",year:"القرن الثاني الهجري / 8th–9th century",sourceUrl:"https://adabworld.com/poems/ma-fy-almqam-ldhy-516g06",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر). النسبة مشهورة وليست قطعية.",verifiedOn:"2026-11-03"},{id:"ar-ahmed-shawqi-064",lang:"ar",text:"وَما نَيلُ المَطالِبِ بِالتَمَنّي ... وَلَكِن تُؤخَذُ الدُنيا غِلابا",translation:"Goals are not reached by wishing; the world is taken by striving.",translationBy:"app",author:"أحمد شوقي",authorAlt:"Ahmed Shawqi",work:"قصيدة «سلوا قلبي» (الشوقيات)",year:"1914",sourceUrl:"https://adabworld.com/poems/slw-qlby-ghdah-sla-wthaba-sruwg90j",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر).",verifiedOn:"2026-11-03"},{id:"ar-ahmed-shawqi-065",lang:"ar",text:"وَما اِستَعصى عَلى قَومٍ مَنالٌ ... إِذا الإِقدامُ كانَ لَهُم رِكابا",translation:"No goal is out of reach for a people when boldness is their mount.",translationBy:"app",author:"أحمد شوقي",authorAlt:"Ahmed Shawqi",work:"قصيدة «سلوا قلبي» (الشوقيات)",year:"1914",sourceUrl:"https://adabworld.com/poems/slw-qlby-ghdah-sla-wthaba-sruwg90j",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر).",verifiedOn:"2026-11-03"},{id:"ar-ahmed-shawqi-066",lang:"ar",text:"فَعَلِّم ما اِستَطَعتَ لَعَلَّ جيلاً ... سَيَأتي يُحدِثُ العَجَبَ العُجابا",translation:"Teach what you can; perhaps a generation will come that does wonders.",translationBy:"app",author:"أحمد شوقي",authorAlt:"Ahmed Shawqi",work:"قصيدة «سلوا قلبي» (الشوقيات)",year:"1914",sourceUrl:"https://adabworld.com/poems/slw-qlby-ghdah-sla-wthaba-sruwg90j",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر).",verifiedOn:"2026-11-03"},{id:"ar-ahmed-shawqi-067",lang:"ar",text:"فَإِن قُرِنَت مَكارِمُها بِعِلمٍ ... تَذَلَّلَتِ العُلا بِهِما صِعابا",translation:"When noble character is joined with knowledge, the heights become easy to climb.",translationBy:"app",author:"أحمد شوقي",authorAlt:"Ahmed Shawqi",work:"قصيدة «سلوا قلبي» (الشوقيات)",year:"1914",sourceUrl:"https://adabworld.com/poems/slw-qlby-ghdah-sla-wthaba-sruwg90j",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر).",verifiedOn:"2026-11-03"},{id:"ar-ahmed-shawqi-068",lang:"ar",text:"فَما حَرَمَ المُجِدَّ جَنى يَدَيهِ ... وَلا نَسِيَ الشَقِيَّ وَلا المُصابا",translation:"The hard worker is never denied the fruit of his hands.",translationBy:"app",author:"أحمد شوقي",authorAlt:"Ahmed Shawqi",work:"قصيدة «سلوا قلبي» (الشوقيات)",year:"1914",sourceUrl:"https://adabworld.com/poems/slw-qlby-ghdah-sla-wthaba-sruwg90j",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر).",verifiedOn:"2026-11-03"},{id:"ar-ahmed-shawqi-069",lang:"ar",text:"وَلا تُرهِق شَبابَ الحَيِّ يَأساً ... فَإِنَّ اليَأسَ يَختَرِمُ الشَبابا",translation:"Do not burden the young with despair, for despair destroys youth.",translationBy:"app",author:"أحمد شوقي",authorAlt:"Ahmed Shawqi",work:"قصيدة «سلوا قلبي» (الشوقيات)",year:"1914",sourceUrl:"https://adabworld.com/poems/slw-qlby-ghdah-sla-wthaba-sruwg90j",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر).",verifiedOn:"2026-11-03"},{id:"ar-ahmed-shawqi-070",lang:"ar",text:"وَأَنَّ البِرَّ خَيرٌ في حَياةٍ ... وَأَبقى بَعدَ صاحِبِهِ ثَوابا",translation:"Doing good is best in life, and its reward outlasts the one who did it.",translationBy:"app",author:"أحمد شوقي",authorAlt:"Ahmed Shawqi",work:"قصيدة «سلوا قلبي» (الشوقيات)",year:"1914",sourceUrl:"https://adabworld.com/poems/slw-qlby-ghdah-sla-wthaba-sruwg90j",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر).",verifiedOn:"2026-11-03"},{id:"ar-abu-al-fath-al-busti-071",lang:"ar",text:"أحسِنْ إلى النّاسِ تَستَعبِدْ قُلوبَهُمُ ... فطالَما استبَعدَ الإنسانَ إحسانُ",translation:"Be good to people and you will win their hearts; kindness has long won people over.",translationBy:"app",author:"أبو الفتح البستي",authorAlt:"Abu al-Fath al-Busti",work:"«النونية» (زيادة المرء في دنياه نقصان)",year:"القرن الرابع الهجري / 10th–11th century",sourceUrl:"https://adabworld.com/poems/zyadh-almr-fy-dnyah-nqsan-w9n2n5oc",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر). صُحّحت أخطاء طباعية ظاهرة في الصفحة.",verifiedOn:"2026-11-03"},{id:"ar-abu-al-fath-al-busti-072",lang:"ar",text:"وكُنْ على الدَّهر مِعواناً لذي أمَلٍ ... يَرجو نَداكَ فإنَّ الحُرَّ مِعْوانُ",translation:"In hard times, be a helper to anyone who hopes for your generosity, for the free man is a helper.",translationBy:"app",author:"أبو الفتح البستي",authorAlt:"Abu al-Fath al-Busti",work:"«النونية» (زيادة المرء في دنياه نقصان)",year:"القرن الرابع الهجري / 10th–11th century",sourceUrl:"https://adabworld.com/poems/zyadh-almr-fy-dnyah-nqsan-w9n2n5oc",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر). صُحّحت أخطاء طباعية ظاهرة في الصفحة.",verifiedOn:"2026-11-03"},{id:"ar-abu-al-fath-al-busti-073",lang:"ar",text:"والرَّوضُ يَزدانُ بالنُّوَّارِ فاغِمةً ... والحُرُّ بالأصلِ والإحسانِ يَزْدانُ",translation:"A garden is adorned by its blossoms, and a free man by his roots and his kindness.",translationBy:"app",author:"أبو الفتح البستي",authorAlt:"Abu al-Fath al-Busti",work:"«النونية» (زيادة المرء في دنياه نقصان)",year:"القرن الرابع الهجري / 10th–11th century",sourceUrl:"https://adabworld.com/poems/zyadh-almr-fy-dnyah-nqsan-w9n2n5oc",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر). صُحّحت أخطاء طباعية ظاهرة في الصفحة.",verifiedOn:"2026-11-03"},{id:"ar-abu-al-fath-al-busti-074",lang:"ar",text:"كُنْ رَيَّقَ البِشْرِ إنْ الحُرَّ هِمَّتُهُ ... صَحيفَةٌ وعَلَيها البِشْرُ عُنْوانُ",translation:"Keep a bright, cheerful face; a free man's spirit is a page, and cheerfulness is its title.",translationBy:"app",author:"أبو الفتح البستي",authorAlt:"Abu al-Fath al-Busti",work:"«النونية» (زيادة المرء في دنياه نقصان)",year:"القرن الرابع الهجري / 10th–11th century",sourceUrl:"https://adabworld.com/poems/zyadh-almr-fy-dnyah-nqsan-w9n2n5oc",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر). صُحّحت أخطاء طباعية ظاهرة في الصفحة.",verifiedOn:"2026-11-03"},{id:"ar-abu-al-fath-al-busti-075",lang:"ar",text:"ورافِقِ الرَّفْقَ في كُلَّ الأمورِ فلَمْ ... يندّمْ رَفيقٌ ولم يذمُمْهُ إنسانُ",translation:"Be gentle in all matters; no gentle person regrets it, and no one blames him.",translationBy:"app",author:"أبو الفتح البستي",authorAlt:"Abu al-Fath al-Busti",work:"«النونية» (زيادة المرء في دنياه نقصان)",year:"القرن الرابع الهجري / 10th–11th century",sourceUrl:"https://adabworld.com/poems/zyadh-almr-fy-dnyah-nqsan-w9n2n5oc",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر). صُحّحت أخطاء طباعية ظاهرة في الصفحة.",verifiedOn:"2026-11-03"},{id:"ar-abu-al-fath-al-busti-076",lang:"ar",text:"ولا يَغُرُّكَ حَظُّ جَرَّهْ خرقٌ ... فالخُرْقُ هَدمٌ ورِفقُ المَرءِ بُنْيانُ",translation:"Do not be fooled by luck that came from rashness; rashness tears down, and gentleness builds.",translationBy:"app",author:"أبو الفتح البستي",authorAlt:"Abu al-Fath al-Busti",work:"«النونية» (زيادة المرء في دنياه نقصان)",year:"القرن الرابع الهجري / 10th–11th century",sourceUrl:"https://adabworld.com/poems/zyadh-almr-fy-dnyah-nqsan-w9n2n5oc",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر). صُحّحت أخطاء طباعية ظاهرة في الصفحة.",verifiedOn:"2026-11-03"},{id:"ar-abu-al-fath-al-busti-077",lang:"ar",text:"فلا تكُنْ عَجِلاً في الأمرِ تطلُبُهُ ... فليسَ يُحمَدُ قبل النُّضْجِ بُحْرانُ",translation:"Do not rush a thing you seek; nothing is praised before it ripens.",translationBy:"app",author:"أبو الفتح البستي",authorAlt:"Abu al-Fath al-Busti",work:"«النونية» (زيادة المرء في دنياه نقصان)",year:"القرن الرابع الهجري / 10th–11th century",sourceUrl:"https://adabworld.com/poems/zyadh-almr-fy-dnyah-nqsan-w9n2n5oc",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر). صُحّحت أخطاء طباعية ظاهرة في الصفحة.",verifiedOn:"2026-11-03"},{id:"ar-abu-al-fath-al-busti-078",lang:"ar",text:"وللامُورِ مَواقيتٌ مُقَدَّرَةٌ ... وكُلُّ أمرٍ لهُ حَدُّ ومِيزانُ",translation:"Things have their appointed times, and every matter has its limit and its measure.",translationBy:"app",author:"أبو الفتح البستي",authorAlt:"Abu al-Fath al-Busti",work:"«النونية» (زيادة المرء في دنياه نقصان)",year:"القرن الرابع الهجري / 10th–11th century",sourceUrl:"https://adabworld.com/poems/zyadh-almr-fy-dnyah-nqsan-w9n2n5oc",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر). صُحّحت أخطاء طباعية ظاهرة في الصفحة.",verifiedOn:"2026-11-03"},{id:"ar-abu-al-fath-al-busti-079",lang:"ar",text:"دَعِ التكاسُلَ في الخَيراتِ تطلُبُها ... فليسَ يسعَدُ بالخَيراتِ كَسْلانُ",translation:"Leave laziness when you seek good things, for the lazy never find happiness in them.",translationBy:"app",author:"أبو الفتح البستي",authorAlt:"Abu al-Fath al-Busti",work:"«النونية» (زيادة المرء في دنياه نقصان)",year:"القرن الرابع الهجري / 10th–11th century",sourceUrl:"https://adabworld.com/poems/zyadh-almr-fy-dnyah-nqsan-w9n2n5oc",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر). صُحّحت أخطاء طباعية ظاهرة في الصفحة.",verifiedOn:"2026-11-03"},{id:"ar-abu-al-fath-al-busti-080",lang:"ar",text:"مَنْ يَزْرَعِ الشَّرَّ يَحصُدْ في عواقبِهِ ... نَدامَةً ولِحَصدِ الزَّرْعِ إبّانُ",translation:"Whoever plants evil harvests regret in the end, and every crop has its season.",translationBy:"app",author:"أبو الفتح البستي",authorAlt:"Abu al-Fath al-Busti",work:"«النونية» (زيادة المرء في دنياه نقصان)",year:"القرن الرابع الهجري / 10th–11th century",sourceUrl:"https://adabworld.com/poems/zyadh-almr-fy-dnyah-nqsan-w9n2n5oc",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر). صُحّحت أخطاء طباعية ظاهرة في الصفحة.",verifiedOn:"2026-11-03"},{id:"ar-abu-al-fath-al-busti-081",lang:"ar",text:"أحسِنْ إذا كانَ إمكانٌ ومَقدِرهٌ ... فلن يَدومَ على الإنسانِ إمكانُ",translation:"Do good while you have the means and the power, for no one keeps that power forever.",translationBy:"app",author:"أبو الفتح البستي",authorAlt:"Abu al-Fath al-Busti",work:"«النونية» (زيادة المرء في دنياه نقصان)",year:"القرن الرابع الهجري / 10th–11th century",sourceUrl:"https://adabworld.com/poems/zyadh-almr-fy-dnyah-nqsan-w9n2n5oc",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر). صُحّحت أخطاء طباعية ظاهرة في الصفحة.",verifiedOn:"2026-11-03"},{id:"ar-abu-al-fath-al-busti-082",lang:"ar",text:"حَسْبُ الفتى عقلُهُ خِلاًّ يُعاشِرُهُ ... إذا تحاماهُ إخوانٌ وخُلاّنُ",translation:"A man's mind is enough of a companion when friends and comrades stay away.",translationBy:"app",author:"أبو الفتح البستي",authorAlt:"Abu al-Fath al-Busti",work:"«النونية» (زيادة المرء في دنياه نقصان)",year:"القرن الرابع الهجري / 10th–11th century",sourceUrl:"https://adabworld.com/poems/zyadh-almr-fy-dnyah-nqsan-w9n2n5oc",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر). صُحّحت أخطاء طباعية ظاهرة في الصفحة.",verifiedOn:"2026-11-03"},{id:"ar-abu-al-fath-al-busti-083",lang:"ar",text:"إذا جَفاكَ خليلٌ كنتَ تألفُهُ ... فاطلُبْ سِواهُ فَكُلُّ النَّاسِ إخوانُ",translation:"If a friend you were close to turns cold, seek another, for all people are brothers.",translationBy:"app",author:"أبو الفتح البستي",authorAlt:"Abu al-Fath al-Busti",work:"«النونية» (زيادة المرء في دنياه نقصان)",year:"القرن الرابع الهجري / 10th–11th century",sourceUrl:"https://adabworld.com/poems/zyadh-almr-fy-dnyah-nqsan-w9n2n5oc",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر). صُحّحت أخطاء طباعية ظاهرة في الصفحة.",verifiedOn:"2026-11-03"},{id:"ar-abu-al-fath-al-busti-084",lang:"ar",text:"مَنْ كانَ للخَيرِ مَنّاعاً فليسَ لَهُ ... على الحَقِيقَةِ إخوانٌ وأخْدانُ",translation:"Whoever withholds good has, in truth, no brothers or close friends.",translationBy:"app",author:"أبو الفتح البستي",authorAlt:"Abu al-Fath al-Busti",work:"«النونية» (زيادة المرء في دنياه نقصان)",year:"القرن الرابع الهجري / 10th–11th century",sourceUrl:"https://adabworld.com/poems/zyadh-almr-fy-dnyah-nqsan-w9n2n5oc",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر). صُحّحت أخطاء طباعية ظاهرة في الصفحة.",verifiedOn:"2026-11-03"},{id:"ar-abu-al-fath-al-busti-085",lang:"ar",text:"يا أيُّها العَالِمُ المَرضِيُّ سيرَتُهُ ... أبشِرْ فأنتَ بغَيرِ الماءِ رَيانُ",translation:"O scholar whose conduct is praised, rejoice: you are satisfied without needing water.",translationBy:"app",author:"أبو الفتح البستي",authorAlt:"Abu al-Fath al-Busti",work:"«النونية» (زيادة المرء في دنياه نقصان)",year:"القرن الرابع الهجري / 10th–11th century",sourceUrl:"https://adabworld.com/poems/zyadh-almr-fy-dnyah-nqsan-w9n2n5oc",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر). صُحّحت أخطاء طباعية ظاهرة في الصفحة.",verifiedOn:"2026-11-03"},{id:"ar-abu-al-fath-al-busti-086",lang:"ar",text:"مَنْ سالَمَ النّاسَ يسلَمْ من غوائِلِهمْ ... وعاشَ وَهْوَ قَريرُ العَينِ جَذْلانُ",translation:"Whoever is at peace with people is safe from their harm, and lives content and glad.",translationBy:"app",author:"أبو الفتح البستي",authorAlt:"Abu al-Fath al-Busti",work:"«النونية» (زيادة المرء في دنياه نقصان)",year:"القرن الرابع الهجري / 10th–11th century",sourceUrl:"https://adabworld.com/poems/zyadh-almr-fy-dnyah-nqsan-w9n2n5oc",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر). صُحّحت أخطاء طباعية ظاهرة في الصفحة.",verifiedOn:"2026-11-03"},{id:"ar-abu-al-fath-al-busti-087",lang:"ar",text:"وذو القَناعَةِ راضٍ في مَعيشَتِهِ ... وصاحبُ الحِرْصِ إن أثرى فَغَضْبانُ",translation:"The contented man is satisfied with his living, and the greedy man, even when rich, is angry.",translationBy:"app",author:"أبو الفتح البستي",authorAlt:"Abu al-Fath al-Busti",work:"«النونية» (زيادة المرء في دنياه نقصان)",year:"القرن الرابع الهجري / 10th–11th century",sourceUrl:"https://adabworld.com/poems/zyadh-almr-fy-dnyah-nqsan-w9n2n5oc",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر). صُحّحت أخطاء طباعية ظاهرة في الصفحة.",verifiedOn:"2026-11-03"},{id:"ar-abu-al-fath-al-busti-088",lang:"ar",text:"مَنْ كانَ للعَقلِ سُلطانٌ عَلَيهِ غَدا ... وما على نَفسِهِ للحِرْصِ سُلطانُ",translation:"Whoever is ruled by reason becomes one over whom greed has no power.",translationBy:"app",author:"أبو الفتح البستي",authorAlt:"Abu al-Fath al-Busti",work:"«النونية» (زيادة المرء في دنياه نقصان)",year:"القرن الرابع الهجري / 10th–11th century",sourceUrl:"https://adabworld.com/poems/zyadh-almr-fy-dnyah-nqsan-w9n2n5oc",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر). صُحّحت أخطاء طباعية ظاهرة في الصفحة.",verifiedOn:"2026-11-03"},{id:"ar-abu-al-fath-al-busti-089",lang:"ar",text:"سلِ اللهَ عَقلاً نافِعاً واستَعِذْ بهِ ... منَ الجَهلِ تَسأَلْ خَيرَ مُعْطٍ لِسائلِ",translation:"Ask God for useful understanding, and seek His protection from ignorance; you are asking the best giver.",translationBy:"app",author:"أبو الفتح البستي",authorAlt:"Abu al-Fath al-Busti",work:"قصيدة «سل الله عقلا نافعا واستعذ به»",year:"القرن الرابع الهجري / 10th–11th century",sourceUrl:"https://adabworld.com/poems/sl-allh-aqla-nafaa-wastadh-bh-twcp1mm9",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر). صُحّحت أخطاء طباعية ظاهرة في الصفحة.",verifiedOn:"2026-11-03"},{id:"ar-abu-al-fath-al-busti-090",lang:"ar",text:"فبالعَقلِ تُستوفى الفضائلُ كُلُّها ... كَما الجَهلُ مُستَوفٍ جميعَ الرَّذائلِ",translation:"With reason all virtues are gained, just as ignorance gathers all vices.",translationBy:"app",author:"أبو الفتح البستي",authorAlt:"Abu al-Fath al-Busti",work:"قصيدة «سل الله عقلا نافعا واستعذ به»",year:"القرن الرابع الهجري / 10th–11th century",sourceUrl:"https://adabworld.com/poems/sl-allh-aqla-nafaa-wastadh-bh-twcp1mm9",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر). صُحّحت أخطاء طباعية ظاهرة في الصفحة.",verifiedOn:"2026-11-03"},{id:"ar-al-imam-al-shafi-i-attri-091",lang:"ar",text:"كُلَّما أَدَّبَني الدَهرُ أَراني نَقصَ عَقلي ... وَإِذا ما اِزدَدتُ عِلماً زادَني عِلماً بِجَهلي",translation:"Whenever time teaches me, it shows me the limits of my mind; the more I learn, the more I learn how little I know.",translationBy:"app",author:"الإمام الشافعي (منسوب)",authorAlt:"al-Imam al-Shafi'i (attributed)",work:"«كلما أدبني الدهر» — ديوان الشافعي",year:"القرن الثاني الهجري / 8th–9th century",sourceUrl:"https://adabworld.com/poems/klma-adbny-aldh-vdodo6",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر). النسبة مشهورة وليست قطعية.",verifiedOn:"2026-11-03"},{id:"ar-al-mutanabbi-092",lang:"ar",text:"ذو العَقلِ يَشقى في النَعيمِ بِعَقلِهِ ... وَأَخو الجَهالَةِ في الشَقاوَةِ يَنعَمُ",translation:"The wise man suffers in comfort because of his mind, and the ignorant man enjoys himself in misery.",translationBy:"app",author:"المتنبي",authorAlt:"al-Mutanabbi",work:"«لهوى النفوس سريرة لا تعلم»",year:"القرن 10م / 10th century",sourceUrl:"https://adabworld.com/poems/lhwa-alnfws-sryra-la-iyb7gs",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر).",verifiedOn:"2026-11-03"},{id:"ar-al-mutanabbi-094",lang:"ar",text:"وَمِنَ العَداوَةِ ما يَنالُكَ نَفعُهُ ... وَمِنَ الصَداقَةِ ما يَضُرُّ وَيُؤلِمُ",translation:"Some enmity brings you benefit, and some friendship harms and hurts.",translationBy:"app",author:"المتنبي",authorAlt:"al-Mutanabbi",work:"«لهوى النفوس سريرة لا تعلم»",year:"القرن 10م / 10th century",sourceUrl:"https://adabworld.com/poems/lhwa-alnfws-sryra-la-iyb7gs",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر).",verifiedOn:"2026-11-03"},{id:"ar-al-mutanabbi-095",lang:"ar",text:"وَمِنَ البَليَّةِ عَذلُ مَن لا يَرعَوي ... عَن غَيِّهِ وَخِطابُ مَن لا يَفهَمُ",translation:"It is an affliction to reproach someone who will not turn from his error, or to address someone who will not understand.",translationBy:"app",author:"المتنبي",authorAlt:"al-Mutanabbi",work:"«لهوى النفوس سريرة لا تعلم»",year:"القرن 10م / 10th century",sourceUrl:"https://adabworld.com/poems/lhwa-alnfws-sryra-la-iyb7gs",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر).",verifiedOn:"2026-11-03"},{id:"ar-hafez-ibrahim-096",lang:"ar",text:"الأُمُّ مَدرَسَةٌ إِذا أَعدَدتَها ... أَعدَدتَ شَعباً طَيِّبَ الأَعراقِ",translation:"A mother is a school: prepare her well and you prepare a people of fine character.",translationBy:"app",author:"حافظ إبراهيم",authorAlt:"Hafez Ibrahim",work:"«كم ذا يكابد عاشق ويلاقي» (الأم مدرسة)",year:"1910 تقريبًا / c. 1910",sourceUrl:"https://adabworld.com/poems/km-dha-ykabd-aashq-wylaqy-fmn1d322",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر).",verifiedOn:"2026-11-03"},{id:"ar-hafez-ibrahim-097",lang:"ar",text:"لا تَحسَبَنَّ العِلمَ يَنفَعُ وَحدَهُ ... ما لَم يُتَوَّج رَبُّهُ بِخَلاقِ",translation:"Do not think knowledge benefits on its own unless its owner is crowned with good character.",translationBy:"app",author:"حافظ إبراهيم",authorAlt:"Hafez Ibrahim",work:"«كم ذا يكابد عاشق ويلاقي» (الأم مدرسة)",year:"1910 تقريبًا / c. 1910",sourceUrl:"https://adabworld.com/poems/km-dha-ykabd-aashq-wylaqy-fmn1d322",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر).",verifiedOn:"2026-11-03"},{id:"ar-hafez-ibrahim-098",lang:"ar",text:"وَالعِلمُ إِن لَم تَكتَنِفهُ شَمائِلٌ ... تُعليهِ كانَ مَطِيَّةَ الإِخفاقِ",translation:"Knowledge that is not surrounded by good qualities to raise it becomes a vehicle for failure.",translationBy:"app",author:"حافظ إبراهيم",authorAlt:"Hafez Ibrahim",work:"«كم ذا يكابد عاشق ويلاقي» (الأم مدرسة)",year:"1910 تقريبًا / c. 1910",sourceUrl:"https://adabworld.com/poems/km-dha-ykabd-aashq-wylaqy-fmn1d322",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر).",verifiedOn:"2026-11-03"},{id:"ar-hafez-ibrahim-099",lang:"ar",text:"فَإِذا رُزِقتَ خَليقَةً مَحمودَةً ... فَقَدِ اِصطَفاكَ مُقَسِّمُ الأَرزاقِ",translation:"If you have been given a praiseworthy character, the divider of fortunes has chosen you.",translationBy:"app",author:"حافظ إبراهيم",authorAlt:"Hafez Ibrahim",work:"«كم ذا يكابد عاشق ويلاقي» (الأم مدرسة)",year:"1910 تقريبًا / c. 1910",sourceUrl:"https://adabworld.com/poems/km-dha-ykabd-aashq-wylaqy-fmn1d322",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر).",verifiedOn:"2026-11-03"},{id:"ar-abu-al-lahham-al-taghlib-100",lang:"ar",text:"وَلَيسَ الفَتى كَما يَقولُ لِسانُهُ ... إِذا لَم يَكُن فِعلٌ مَعَ القَولِ يُوجَدُ",translation:"A young man is not what his tongue says, unless there is action alongside the words.",translationBy:"app",author:"أبو اللحام التغلبي",authorAlt:"Abu al-Lahham al-Taghlibi",work:"«أمرت وطولت التفكر خاليا»",year:"جاهلي/مخضرم",sourceUrl:"https://adabworld.com/poems/amrt-watwlt-altfkr-khalya-zj7v0ten",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر).",verifiedOn:"2026-11-03"},{id:"ar-ali-ibn-abi-talib-attrib-101",lang:"ar",text:"العِلمُ زَينٌ فَكُن لِلعِلمِ مُكتَسِباً ... وَكُن لَهُ طالِباً ما عِشتَ مُقتَبِسا",translation:"Knowledge is an adornment, so keep acquiring it, and remain a seeker of it as long as you live.",translationBy:"app",author:"علي بن أبي طالب (منسوب)",authorAlt:"Ali ibn Abi Talib (attributed)",work:"«العلم زين فكن للعلم مكتسبا»",year:"القرن 7م / 7th century",sourceUrl:"https://www.aldiwan.net/poem30998.html",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر). النسبة مشهورة وليست قطعية.",verifiedOn:"2026-11-03"},{id:"ar-abu-al-ala-al-maarri-102",lang:"ar",text:"لا تَفرَحَنَّ بِفَألٍ إِن سَمِعتَ بِهِ ... وَلا تَطَيَّر إِذا ما ناعِبٌ نَعَبا",translation:"Do not rejoice at a good omen you hear, and do not feel doomed when a crow caws.",translationBy:"app",author:"أبو العلاء المعري",authorAlt:"Abu al-Ala al-Maarri",work:"«لا تفرحن بفأل إن سمعت به»",year:"القرن 11م / 11th century",sourceUrl:"https://adabworld.com/poems/la-tfrhn-bfal-in-dhs3u6",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر).",verifiedOn:"2026-11-03"},{id:"ar-abu-al-ala-al-maarri-103",lang:"ar",text:"فَالخَطبُ أَفظَعُ مِن سَرّاءَ تَأمُلُها ... وَالأَمرُ أَيسَرُ مِن أَن تُضمِرَ الرُعُبا",translation:"Disaster is harsher than the joy you hope for, and the matter is easier than the fear you carry.",translationBy:"app",author:"أبو العلاء المعري",authorAlt:"Abu al-Ala al-Maarri",work:"«لا تفرحن بفأل إن سمعت به»",year:"القرن 11م / 11th century",sourceUrl:"https://adabworld.com/poems/la-tfrhn-bfal-in-dhs3u6",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر).",verifiedOn:"2026-11-03"},{id:"ar-abu-al-ala-al-maarri-104",lang:"ar",text:"إِذا تَفَكَّرتَ فِكراً لا يُمازِجُهُ ... فَسادُ عَقلٍ صَحيحٍ هانَ ما صَعُبا",translation:"When you think with a sound mind, free of corruption, what was hard becomes easy.",translationBy:"app",author:"أبو العلاء المعري",authorAlt:"Abu al-Ala al-Maarri",work:"«لا تفرحن بفأل إن سمعت به»",year:"القرن 11م / 11th century",sourceUrl:"https://adabworld.com/poems/la-tfrhn-bfal-in-dhs3u6",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر).",verifiedOn:"2026-11-03"},{id:"ar-abu-al-ala-al-maarri-105",lang:"ar",text:"إِذا رَأَيتُم كَريماً عِندَ غَيرِكُمُ ... فَأَكرِموهُ عَلى يُسرٍ وَإِنضابِ",translation:"If you see a noble person among others, honor him, in ease and in hardship.",translationBy:"app",author:"أبو العلاء المعري",authorAlt:"Abu al-Ala al-Maarri",work:"«إذا رأيتم كريما عند غيركم»",year:"القرن 11م / 11th century",sourceUrl:"https://adabworld.com/poems/idha-raytm-kryma-and-ii8f0z",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر).",verifiedOn:"2026-11-03"},{id:"ar-abu-al-atahiya-106",lang:"ar",text:"أَلا إِنَّما الإِخوانُ عِندَ الحَقائِقِ ... وَلا خَيرَ في وُدِّ الصَديقِ المُماذِقِ",translation:"True brothers are known when things become real; there is no good in a friend whose love is diluted.",translationBy:"app",author:"أبو العتاهية",authorAlt:"Abu al-Atahiya",work:"«ألا إنما الإخوان عند الحقائق»",year:"القرن 8–9م / 8th–9th century",sourceUrl:"https://adabworld.com/poems/ala-inma-alikhwan-and-j0jpii",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر).",verifiedOn:"2026-11-03"},{id:"ar-abu-al-atahiya-107",lang:"ar",text:"لَعَمرُكَ ما شَيءٌ مِنَ العَيشِ كُلِّهِ ... أَقَرَّ لِعَيني مِن صَديقٍ مُوافِقِ",translation:"By your life, nothing in all of living is more pleasing to my eyes than a like-minded friend.",translationBy:"app",author:"أبو العتاهية",authorAlt:"Abu al-Atahiya",work:"«ألا إنما الإخوان عند الحقائق»",year:"القرن 8–9م / 8th–9th century",sourceUrl:"https://adabworld.com/poems/ala-inma-alikhwan-and-j0jpii",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر).",verifiedOn:"2026-11-03"},{id:"ar-abu-al-atahiya-108",lang:"ar",text:"صَفِيِّ مِنَ الإِخوانِ كُلُّ مُوافِقٍ ... صَبورٍ عَلى ما نابَ عِندَ الحَقائِقِ",translation:"My true friend is everyone like-minded, patient with what befalls when things become real.",translationBy:"app",author:"أبو العتاهية",authorAlt:"Abu al-Atahiya",work:"«ألا إنما الإخوان عند الحقائق»",year:"القرن 8–9م / 8th–9th century",sourceUrl:"https://adabworld.com/poems/ala-inma-alikhwan-and-j0jpii",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر).",verifiedOn:"2026-11-03"},{id:"ar-abu-al-atahiya-109",lang:"ar",text:"وَلا خَيرَ فيمَن لا يُوَطِّنُ نَفسَهُ ... عَلى نائِباتِ الدَهرِ حينَ تَنوبُ",translation:"There is no good in one who does not prepare himself for the blows of time when they come.",translationBy:"app",author:"أبو العتاهية",authorAlt:"Abu al-Atahiya",work:"«ولا خير فيمن لا يوطن نفسه»",year:"القرن 8–9م / 8th–9th century",sourceUrl:"https://adabworld.com/poems/wla-khyr-fymn-la-z3jrqk",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر).",verifiedOn:"2026-11-03"},{id:"ar-abu-al-atahiya-110",lang:"ar",text:"طوبى لِكُلِّ مُفَكِّرٍ ... وَلِكُلِّ مُحتَسِبٍ صَبورِ",translation:"Blessed is everyone who reflects, and everyone who is patient and seeks reward.",translationBy:"app",author:"أبو العتاهية",authorAlt:"Abu al-Atahiya",work:"«لله عاقبة الأمور»",year:"القرن 8–9م / 8th–9th century",sourceUrl:"https://adabworld.com/poems/llh-aaqba-alamwr-rs62yd",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر).",verifiedOn:"2026-11-03"},{id:"ar-abu-al-atahiya-111",lang:"ar",text:"الصِدقُ شَيءٌ لا يَقومُ بِهِ اِمرُؤٌ ... إِلّا وَحَشوُ فُؤادِهِ الإيمانُ",translation:"Truthfulness is something no one can sustain unless his heart is filled with faith.",translationBy:"app",author:"أبو العتاهية",authorAlt:"Abu al-Atahiya",work:"«كل امرئ فكما يدين يدان»",year:"القرن 8–9م / 8th–9th century",sourceUrl:"https://adabworld.com/poems/kl-amr-fkma-ydyn-ni9tjk",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر).",verifiedOn:"2026-11-03"},{id:"ar-abu-al-atahiya-112",lang:"ar",text:"أَبشِر بِعَونِ اللَهِ إِن تَكُ مُحسِناً ... فَالمَرءُ يُحسِنُ طَرفَةً فَيُعانُ",translation:"Take heart in God's help if you do good; a person does good for a moment and is helped.",translationBy:"app",author:"أبو العتاهية",authorAlt:"Abu al-Atahiya",work:"«كل امرئ فكما يدين يدان»",year:"القرن 8–9م / 8th–9th century",sourceUrl:"https://adabworld.com/poems/kl-amr-fkma-ydyn-ni9tjk",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر).",verifiedOn:"2026-11-03"},{id:"ar-abu-al-atahiya-113",lang:"ar",text:"أَلا إِنَّ أَبقى الذُخرِ خَيرٌ تُنيلُهُ ... وَشَرَّ كَلامِ القائِلينَ فُضولُهُ",translation:"The most lasting treasure is a good deed you give, and the worst speech is idle excess.",translationBy:"app",author:"أبو العتاهية",authorAlt:"Abu al-Atahiya",work:"«ألا إن أبقى الذخر خير تنيله»",year:"القرن 8–9م / 8th–9th century",sourceUrl:"https://adabworld.com/poems/ala-in-abqa-aldhkhr-20cori",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر).",verifiedOn:"2026-11-03"},{id:"ar-abu-al-atahiya-114",lang:"ar",text:"عَلَيكَ بِما يَعنيكَ مِن كُلِّ ما تَرى ... وَبِالصَمتِ إِلّا عَن جَميلٍ تَقولُهُ",translation:"Stick to what concerns you in all you see, and keep silent except for good words you say.",translationBy:"app",author:"أبو العتاهية",authorAlt:"Abu al-Atahiya",work:"«ألا إن أبقى الذخر خير تنيله»",year:"القرن 8–9م / 8th–9th century",sourceUrl:"https://adabworld.com/poems/ala-in-abqa-aldhkhr-20cori",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر).",verifiedOn:"2026-11-03"},{id:"ar-abu-al-atahiya-115",lang:"ar",text:"لا يُعجِبَنَّكَ يا ذا حُسنُ مَنظَرَةِ ... لَم يَجعَلِ اللَهُ فيها حُسنَ مَخبَرَةِ",translation:"Do not be impressed by a fine appearance that has no fine substance inside.",translationBy:"app",author:"أبو العتاهية",authorAlt:"Abu al-Atahiya",work:"«لا يعجبنك يا ذا حسن منظرة»",year:"القرن 8–9م / 8th–9th century",sourceUrl:"https://adabworld.com/poems/la-yajbnk-ya-dha-d82tk3",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر).",verifiedOn:"2026-11-03"},{id:"ar-abu-al-atahiya-116",lang:"ar",text:"خَيرُ اِكتِسابِ الفَتى ما كانَ مِن عَمَلٍ ... زاكٍ وَصَبرٍ عَلى عُسرٍ وَمَيسَرَةِ",translation:"The best a man can earn is pure action, and patience in hardship and in ease.",translationBy:"app",author:"أبو العتاهية",authorAlt:"Abu al-Atahiya",work:"«لا يعجبنك يا ذا حسن منظرة»",year:"القرن 8–9م / 8th–9th century",sourceUrl:"https://adabworld.com/poems/la-yajbnk-ya-dha-d82tk3",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر).",verifiedOn:"2026-11-03"},{id:"ar-abu-al-atahiya-117",lang:"ar",text:"وَأَفضَلُ الزُهدِ زُهدٌ كانَ عَن جِدَةٍ ... وَأَفضَلُ العَفوِ عَفوٌ عِندَ مَقدِرَةِ",translation:"The best renunciation is by one who has plenty, and the best forgiveness is by one who has power.",translationBy:"app",author:"أبو العتاهية",authorAlt:"Abu al-Atahiya",work:"«لا يعجبنك يا ذا حسن منظرة»",year:"القرن 8–9م / 8th–9th century",sourceUrl:"https://adabworld.com/poems/la-yajbnk-ya-dha-d82tk3",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر).",verifiedOn:"2026-11-03"},{id:"ar-abu-al-atahiya-118",lang:"ar",text:"لا خَيرَ لا خَيرَ لِلإِنسانِ في طَمَعٍ ... يَصيرُ مِنهُ إِلى ذُلٍّ وَمَحقَرَةِ",translation:"No good, no good at all, for a person in greed that leads him to humiliation and contempt.",translationBy:"app",author:"أبو العتاهية",authorAlt:"Abu al-Atahiya",work:"«لا يعجبنك يا ذا حسن منظرة»",year:"القرن 8–9م / 8th–9th century",sourceUrl:"https://adabworld.com/poems/la-yajbnk-ya-dha-d82tk3",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر).",verifiedOn:"2026-11-03"},{id:"ar-abu-al-ala-al-maarri-119",lang:"ar",text:"إِسمَع مَقالَةَ ذي لُبٍّ وَتَجرُبَةٍ ... يُفِدكَ في اليَومِ ما في دَهرِهِ عَلِما",translation:"Listen to the words of a person of wisdom and experience; in a day he will give you what he learned in a lifetime.",translationBy:"app",author:"أبو العلاء المعري",authorAlt:"Abu al-Ala al-Maarri",work:"«إسمع مقالة ذي لب وتجربة»",year:"القرن 11م / 11th century",sourceUrl:"https://adabworld.com/poems/isma-mqala-dhy-lb-a7ydgm",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر).",verifiedOn:"2026-11-03"},{id:"ar-abu-firas-al-hamdani-120",lang:"ar",text:"تَهونُ عَلَينا في المَعالي نُفوسُنا ... وَمَن خَطَبَ الحَسناءَ لَم يُغلِها المَهرُ",translation:"Our lives are a small price to us in pursuit of the heights; whoever courts a beauty does not find the dowry too high.",translationBy:"app",author:"أبو فراس الحمداني",authorAlt:"Abu Firas al-Hamdani",work:"«أراك عصي الدمع شيمتك الصبر»",year:"القرن 10م / 10th century",sourceUrl:"https://adabworld.com/poems/arak-asy-aldma-shymtk-vlpbft",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر).",verifiedOn:"2026-11-03"},{id:"ar-abu-firas-al-hamdani-122",lang:"ar",text:"وَإِن مُتُّ فَالإِنسانُ لابُدَّ مَيِّتٌ ... وَإِن طالَتِ الأَيّامُ وَاِنفَسَحَ العُمرُ",translation:"If I die, every human must die, however long the days and wide the lifespan.",translationBy:"app",author:"أبو فراس الحمداني",authorAlt:"Abu Firas al-Hamdani",work:"«أراك عصي الدمع شيمتك الصبر»",year:"القرن 10م / 10th century",sourceUrl:"https://adabworld.com/poems/arak-asy-aldma-shymtk-vlpbft",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر).",verifiedOn:"2026-11-03"},{id:"ar-ahmad-shawqi-123",lang:"ar",text:"وإنما الأمم الأخلاق ما بقيت ... فإن همو ذهبت أخلاقهم ذهبوا",translation:"Nations live as long as their morals live; if their morals go, they go.",translationBy:"app",author:"أحمد شوقي",authorAlt:"Ahmad Shawqi",work:"«صحوت واستدركتني شيمتي الأدب»",year:"أوائل القرن 20 / early 20th century",sourceUrl:"https://adabworld.com/poems/shwt-wastdrktny-shymty-aladb-n71fswxt",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر).",verifiedOn:"2026-11-03"},{id:"ar-ahmad-shawqi-124",lang:"ar",text:"والصدق أرفع ما اهتز الرجال له ... وخير ما عوّد ابناً في الحياة أب",translation:"Truthfulness is the noblest thing that stirs men, and the best habit a father can give his son in life.",translationBy:"app",author:"أحمد شوقي",authorAlt:"Ahmad Shawqi",work:"«صحوت واستدركتني شيمتي الأدب»",year:"أوائل القرن 20 / early 20th century",sourceUrl:"https://adabworld.com/poems/shwt-wastdrktny-shymty-aladb-n71fswxt",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر). صُحّح «أبناً» إلى «ابناً».",verifiedOn:"2026-11-03"},{id:"ar-abu-al-ala-al-maarri-125",lang:"ar",text:"وَإِنَّ سَبيلَ الخَيرِ لِلمَرءِ واضِحٌ ... إِلى يَومٍ يَقضي ثُمَّ تَنقَطِعُ السُبُل",translation:"The path of good is clear for a person until the day he dies; then all paths are cut off.",translationBy:"app",author:"أبو العلاء المعري",authorAlt:"Abu al-Ala al-Maarri",work:"«إذا شئت أن ترقى جدارك مرة»",year:"القرن 11م / 11th century",sourceUrl:"https://adabworld.com/poems/idha-sht-an-trqa-56mqer",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر).",verifiedOn:"2026-11-03"},{id:"ar-abu-tammam-126",lang:"ar",text:"السيف أصدق إنباءً من الكتب ... في حده الحد بين الجد واللعب",translation:"The sword is more truthful than books; its edge is the line between seriousness and play.",translationBy:"app",author:"أبو تمام",authorAlt:"Abu Tammam",work:"«السيف أصدق أنباءً من الكتب» (فتح عمورية)",year:"838م / 838 CE",sourceUrl:"https://diwanalarab.com/%d8%a7%d9%84%d8%b3%d9%8a%d9%81-%d8%a3%d8%b5%d8%af%d9%82-%d8%a5%d9%86%d8%a8%d8%a7%d8%a1%d9%8b",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر).",verifiedOn:"2026-11-03"},{id:"ar-salih-ibn-abd-al-quddus-127",lang:"ar",text:"أَطل الصَمت فَإِن الصَمتَ حلم ... وَإِذا قُمتَ فَبِالحَقِّ فَقُم",translation:"Keep long silences, for silence is wisdom; and when you stand up, stand up for what is right.",translationBy:"app",author:"صالح بن عبد القدوس",authorAlt:"Salih ibn Abd al-Quddus",work:"«أطل الصمت فإن الصمت حلم»",year:"القرن 8م / 8th century",sourceUrl:"https://www.aldiwan.net/poem76223.html",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر).",verifiedOn:"2026-11-03"},{id:"ar-salih-ibn-abd-al-quddus-128",lang:"ar",text:"اِذا ما أَهَنت النَفسَ لَم تَلقَ مُكرماً ... لَها بَعد اِذ عَرضتها لهوان",translation:"If you humiliate yourself, you will find no one to honor you once you have exposed yourself to disgrace.",translationBy:"app",author:"صالح بن عبد القدوس",authorAlt:"Salih ibn Abd al-Quddus",work:"«اذا ما أهنت النفس لم تلق مكرما»",year:"القرن 8م / 8th century",sourceUrl:"https://www.aldiwan.net/poem76215.html",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر).",verifiedOn:"2026-11-03"},{id:"ar-salih-ibn-abd-al-quddus-129",lang:"ar",text:"وَلا أَدرك الحاجاتِ مِثلُ مثابِر ... وَلا عاف عَنها النَجح مِثل ثَوان",translation:"Nothing achieves goals like persistence, and nothing keeps success away like slackness.",translationBy:"app",author:"صالح بن عبد القدوس",authorAlt:"Salih ibn Abd al-Quddus",work:"«اذا ما أهنت النفس لم تلق مكرما»",year:"القرن 8م / 8th century",sourceUrl:"https://www.aldiwan.net/poem76215.html",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر).",verifiedOn:"2026-11-03"},{id:"ar-salih-ibn-abd-al-quddus-130",lang:"ar",text:"وَإِذا أَعلَنت أَمراً حسناً ... فَليَكُن أَحسَن مِنهُ ما تَسر",translation:"If you show something good in public, let what you keep in private be better still.",translationBy:"app",author:"صالح بن عبد القدوس",authorAlt:"Salih ibn Abd al-Quddus",work:"«وإذا أعلنت أمرا حسنا»",year:"القرن 8م / 8th century",sourceUrl:"https://www.aldiwan.net/poem76224.html",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر).",verifiedOn:"2026-11-03"},{id:"ar-maruf-al-rusafi-131",lang:"ar",text:"أخْصِ في العلم إن أردت كمالاً ... ووصولاً إلى الفَخار الأتمّ",translation:"Specialize in knowledge if you want perfection and to reach the fullest pride.",translationBy:"app",author:"معروف الرصافي",authorAlt:"Maruf al-Rusafi",work:"«أخص في العلم إن أردت كمالا»",year:"أوائل القرن 20 / early 20th century",sourceUrl:"https://adabworld.com/poems/akhs-fy-alalm-in-ardt-kmala-70bnang7",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر). تقسيم الشطرين أو وصل كلمة مقطوعة في الصفحة تمّ منّا.",verifiedOn:"2026-11-03"},{id:"ar-maruf-al-rusafi-132",lang:"ar",text:"وتَرَفّقْ إذا جهدت فإن الرفق ... يُذكي الفؤاد والعُنف يُعمي",translation:"Be gentle when you strive, for gentleness sharpens the mind and harshness blinds it.",translationBy:"app",author:"معروف الرصافي",authorAlt:"Maruf al-Rusafi",work:"«أخص في العلم إن أردت كمالا»",year:"أوائل القرن 20 / early 20th century",sourceUrl:"https://adabworld.com/poems/akhs-fy-alalm-in-ardt-kmala-70bnang7",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر). تقسيم الشطرين أو وصل كلمة مقطوعة في الصفحة تمّ منّا.",verifiedOn:"2026-11-03"},{id:"ar-maruf-al-rusafi-133",lang:"ar",text:"وإذا ما اشتغلت بالجِدّ ساعات ... فهازل سُويعةً واستجم",translation:"When you have worked seriously for hours, play for a little while and rest.",translationBy:"app",author:"معروف الرصافي",authorAlt:"Maruf al-Rusafi",work:"«أخص في العلم إن أردت كمالا»",year:"أوائل القرن 20 / early 20th century",sourceUrl:"https://adabworld.com/poems/akhs-fy-alalm-in-ardt-kmala-70bnang7",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر). تقسيم الشطرين أو وصل كلمة مقطوعة في الصفحة تمّ منّا.",verifiedOn:"2026-11-03"},{id:"ar-maruf-al-rusafi-134",lang:"ar",text:"كفى بالعلم في الظلمات نورا ... يُبيّن في الحياة لنا الأمورا",translation:"Knowledge is light enough in the darkness, making things clear for us in life.",translationBy:"app",author:"معروف الرصافي",authorAlt:"Maruf al-Rusafi",work:"«كفى بالعلم في الظلمات نورا»",year:"أوائل القرن 20 / early 20th century",sourceUrl:"https://adabworld.com/poems/kfa-balalm-fy-alzlmat-nwra-k6ors1ap",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر). تقسيم الشطرين أو وصل كلمة مقطوعة في الصفحة تمّ منّا.",verifiedOn:"2026-11-03"},{id:"ar-maruf-al-rusafi-135",lang:"ar",text:"ولكن ليس مُنتَفِعاً بعلم ... فتىً لم يُحرز الخُلُق النضيرا",translation:"But a young man who has not gained fine character does not benefit from knowledge.",translationBy:"app",author:"معروف الرصافي",authorAlt:"Maruf al-Rusafi",work:"«كفى بالعلم في الظلمات نورا»",year:"أوائل القرن 20 / early 20th century",sourceUrl:"https://adabworld.com/poems/kfa-balalm-fy-alzlmat-nwra-k6ors1ap",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر). تقسيم الشطرين أو وصل كلمة مقطوعة في الصفحة تمّ منّا.",verifiedOn:"2026-11-03"},{id:"ar-maruf-al-rusafi-136",lang:"ar",text:"إذا ما العلم لابس حُسنَ خُلْق ... فَرَجِّ لأهله خيراً كثيرا",translation:"When knowledge is clothed in good character, expect much good for those who have it.",translationBy:"app",author:"معروف الرصافي",authorAlt:"Maruf al-Rusafi",work:"«كفى بالعلم في الظلمات نورا»",year:"أوائل القرن 20 / early 20th century",sourceUrl:"https://adabworld.com/poems/kfa-balalm-fy-alzlmat-nwra-k6ors1ap",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر). تقسيم الشطرين أو وصل كلمة مقطوعة في الصفحة تمّ منّا.",verifiedOn:"2026-11-03"},{id:"ar-maruf-al-rusafi-137",lang:"ar",text:"وما أن فاز أغزرنا علوماً ... ولكن فاز أسلمنا ضميرا",translation:"It is not the most learned of us who win, but the one with the soundest conscience.",translationBy:"app",author:"معروف الرصافي",authorAlt:"Maruf al-Rusafi",work:"«كفى بالعلم في الظلمات نورا»",year:"أوائل القرن 20 / early 20th century",sourceUrl:"https://adabworld.com/poems/kfa-balalm-fy-alzlmat-nwra-k6ors1ap",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو (التشكيل من المصدر). تقسيم الشطرين أو وصل كلمة مقطوعة في الصفحة تمّ منّا.",verifiedOn:"2026-11-03"},{id:"ar-salih-ibn-abd-al-quddus-139",lang:"ar",text:"شَر المَواهِب ما تَجودُ بِهِ ... مِن غَيرِ محمدة وَلا أَجر",translation:"The worst gift is one given without praise or reward.",translationBy:"app",author:"صالح بن عبد القدوس",authorAlt:"Salih ibn Abd al-Quddus",work:"«شر المواهب ما تجود به»",year:"القرن 8م / 8th century",sourceUrl:"https://www.aldiwan.net/poem76233.html",sourceNote:"ملكية عامة؛ النص منقول من الصفحة المرتبطة كما هو
