# Builds and publishes HANTER GAMES to GitHub Pages on every push to main.
# Repository → Settings → Secrets and variables → Actions → Variables:
#   VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY  (browser-safe values only; never the secret key)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Unit tests (dates, scheduling, scoring)
        run: npm test
      - name: Type check (reported, does not block the deploy yet)
        run: npx tsc --noEmit -p tsconfig.json || echo "::warning::Type errors found — see log"
      - name: Build
        run: npx vite build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
